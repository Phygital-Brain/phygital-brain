<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Brain details: about you (1 of 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">What's your name, and what do you do in one line?</label>
      <input type="text" data-name="name" placeholder="Ana Costa, illustrator for children's books">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What describes you best?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Freelancer or creator</span><br><span style="font-size:11px; color:var(--text-muted)">Works for themselves</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Small business owner</span><br><span style="font-size:11px; color:var(--text-muted)">One-person or tiny company</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Employee or professional</span><br><span style="font-size:11px; color:var(--text-muted)">Works for a company</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Personal projects</span><br><span style="font-size:11px; color:var(--text-muted)">Studies, hobbies, side projects</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Other</span><br><span style="font-size:11px; color:var(--text-muted)">Write it in your words</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Teacher who sells courses on the side" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Do you sell anything or have clients?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Yes, services or clients</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Yes, products</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Not yet, planning to</button>
        <button type="button" class="elicit-pill" data-value="No">No</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What should your second brain help with?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Organise projects</span><br><span style="font-size:11px; color:var(--text-muted)">Plans, status, next steps</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Remember people</span><br><span style="font-size:11px; color:var(--text-muted)">Clients, collaborators, contacts</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Write for me</span><br><span style="font-size:11px; color:var(--text-muted)">Emails and posts in my voice</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Goals and decisions</span><br><span style="font-size:11px; color:var(--text-muted)">What I'm aiming for and why</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Other</span><br><span style="font-size:11px; color:var(--text-muted)">Write it in your words</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="Keep track of my reading" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What are you good at? Skills, strengths, what people come to you for.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Drawing animals, explaining ideas simply, working fast under deadlines"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What do you stand for, and what work do you say no to?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Honest work, fair pay. No gambling or tobacco clients."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you take things in best?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Short lists</button>
        <button type="button" class="elicit-pill" data-value="Examples">Examples</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Step by step</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Pictures and diagrams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Voice notes I can listen to" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">When do you focus best?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Early morning</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Late morning</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Afternoon</button>
        <button type="button" class="elicit-pill" data-value="Night">Night</button>
        <button type="button" class="elicit-pill" data-value="It changes">It changes</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="What drains you? Long calls, too many messages, admin on Fridays"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How should your agent talk to you?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Short and plain</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Detailed</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Friendly and casual</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Formal and professional</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Direct, with a bit of humour" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Where are you based? Optional, it sets your time zone.</label>
      <input type="text" data-name="city" placeholder="Lisbon, Portugal">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Got a link that describes you? Your agent reads it so you type less.</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
