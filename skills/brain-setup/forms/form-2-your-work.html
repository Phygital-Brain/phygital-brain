<h2 class="sr-only">Setup form 2 of 4: your work.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Brain details: your work (2 of 4)</span>
  </div>
  <div class="elicit-body">
    <!-- JOB QUESTIONS: replace this whole block, down to END JOB QUESTIONS, with 3 questions written for the person's own work (see SKILL.md, Form 2). Example for an illustrator:
    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Per project">Per project</button>
        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>
    END JOB QUESTIONS -->
    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Who are your customers?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">Businesses and brands</button>
        <button type="button" class="elicit-pill" data-value="Agencies">Agencies</button>
        <button type="button" class="elicit-pill" data-value="Individuals">Individuals</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Other creators</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Schools" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do most customers find you?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">Referrals and word of mouth</button>
        <button type="button" class="elicit-pill" data-value="Social media">Social media</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">I reach out to them</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">Platforms or marketplaces</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Book fairs" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What slows you down most?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Finding clients</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Admin, quotes and invoices</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Posting content regularly</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Too many tools and scattered notes</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Or say it in your words"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What's your main goal for the next 12 months?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Earn more</button>
        <button type="button" class="elicit-pill" data-value="More free time">More free time</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Launch something new</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Get organised</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Or say it in your words: sign my first book deal"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Which areas matter most right now?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Career or job</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Learning or studies</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Creative projects</button>
        <button type="button" class="elicit-pill" data-value="Side project">Side project</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Health and sport" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What slows you down most?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Too many ideas, no follow-through</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Scattered notes</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Forgetting details about people</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">No clear goals</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Or say it in your words"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What's your main goal for the next 12 months?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Grow in my career</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Finish a big project</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Learn a new skill</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Get organised</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Or say it in your words: finish my first short film"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">What are you working on now? Up to 3, one per line.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="New picture book for a publisher&#10;Portfolio website&#10;Saving for a studio"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">What's worrying you most right now?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Two deadlines in the same week and no time to look for new work"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Continue</button>
  </div>
</form>
