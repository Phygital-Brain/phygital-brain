<h2 class="sr-only">Biểu mẫu thiết lập 1/4: về bạn.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Thông tin bộ não: về bạn (1/4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Bạn tên gì, và bạn làm gì? Một dòng thôi.</label>
      <input type="text" data-name="name" placeholder="Lan Nguyễn, họa sĩ minh họa sách thiếu nhi">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Điều nào đúng với bạn nhất?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Freelancer hoặc nhà sáng tạo nội dung</span><br><span style="font-size:11px; color:var(--text-muted)">Tự làm chủ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Chủ doanh nghiệp nhỏ</span><br><span style="font-size:11px; color:var(--text-muted)">Công ty một người hoặc rất nhỏ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Nhân viên hoặc người làm chuyên môn</span><br><span style="font-size:11px; color:var(--text-muted)">Làm việc cho một công ty</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Dự án cá nhân</span><br><span style="font-size:11px; color:var(--text-muted)">Học tập, sở thích, dự án tay trái</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Khác</span><br><span style="font-size:11px; color:var(--text-muted)">Viết theo cách của bạn</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Giáo viên, bán thêm khóa học online" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn có bán gì hoặc có khách hàng không?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Có, dịch vụ hoặc khách hàng</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Có, sản phẩm</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Chưa, nhưng đang định</button>
        <button type="button" class="elicit-pill" data-value="No">Không</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn muốn bộ não thứ hai giúp việc gì?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Sắp xếp dự án</span><br><span style="font-size:11px; color:var(--text-muted)">Kế hoạch, tiến độ, bước tiếp theo</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Nhớ thông tin về mọi người</span><br><span style="font-size:11px; color:var(--text-muted)">Khách hàng, cộng sự, người quen</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Viết giúp mình</span><br><span style="font-size:11px; color:var(--text-muted)">Email và bài đăng theo giọng văn của mình</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Mục tiêu và quyết định</span><br><span style="font-size:11px; color:var(--text-muted)">Mình đang hướng tới điều gì và vì sao</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Khác</span><br><span style="font-size:11px; color:var(--text-muted)">Viết theo cách của bạn</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="Theo dõi những gì mình đọc" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn giỏi gì? Kỹ năng, thế mạnh, những việc người khác hay tìm đến bạn.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Vẽ động vật, giải thích ý tưởng dễ hiểu, làm nhanh khi gấp deadline"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn coi trọng điều gì, và bạn từ chối những việc nào?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Làm ăn tử tế, trả công sòng phẳng. Không nhận khách cờ bạc hay thuốc lá."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn tiếp thu thông tin tốt nhất theo cách nào?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Danh sách ngắn</button>
        <button type="button" class="elicit-pill" data-value="Examples">Ví dụ</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Từng bước một</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Hình ảnh và sơ đồ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Khác</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Tin nhắn thoại để mình nghe" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn tập trung tốt nhất vào lúc nào?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Sáng sớm</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Gần trưa</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Buổi chiều</button>
        <button type="button" class="elicit-pill" data-value="Night">Buổi tối</button>
        <button type="button" class="elicit-pill" data-value="It changes">Tùy hôm</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Điều gì làm bạn đuối? Gọi điện lâu, quá nhiều tin nhắn, giấy tờ vào thứ Sáu"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn muốn trợ lý AI nói chuyện với bạn thế nào?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Ngắn gọn, dễ hiểu</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Chi tiết</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Thân thiện, thoải mái</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Lịch sự, chuyên nghiệp</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Khác</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Thẳng thắn, thêm chút hài hước" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bạn đang sống ở đâu? Không bắt buộc, dùng để đặt múi giờ.</label>
      <input type="text" data-name="city" placeholder="Đà Nẵng, Việt Nam">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Có đường link nào giới thiệu về bạn không? Trợ lý AI sẽ đọc để bạn đỡ phải gõ.</label>
      <input type="text" data-name="link" placeholder="https://trangcuaban.vn">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Bỏ qua</button>
    <button type="button" class="elicit-submit">Tiếp tục</button>
  </div>
</form>
