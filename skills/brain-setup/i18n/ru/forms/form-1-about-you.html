  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Как вас зовут и чем вы занимаетесь? В одну строку.</label>
      <input type="text" data-name="name" placeholder="Анна Соколова, иллюстратор детских книг">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Что лучше всего описывает вас?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Фрилансер или автор</span><br><span style="font-size:11px; color:var(--text-muted)">Работаю на себя</span></span></button>

        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Личные проекты</span><br><span style="font-size:11px; color:var(--text-muted)">Учеба, хобби, проекты для себя</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Другое</span><br><span style="font-size:11px; color:var(--text-muted)">Напишите своими словами</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Учитель, параллельно продаю свои курсы" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Вы что-то продаете или работаете с клиентами?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Да, услуги или клиенты</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Да, товары</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Пока нет, но планирую</button>
        <button type="button" class="elicit-pill" data-value="No">Нет</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">С чем должен помогать ваш второй мозг?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Держать проекты в порядке</span><br><span style="font-size:11px; color:var(--text-muted)">Планы, статус, следующие шаги</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Помнить людей</span><br><span style="font-size:11px; color:var(--text-muted)">Клиенты, соавторы, контакты</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Писать за меня</span><br><span style="font-size:11px; color:var(--text-muted)">Письма и посты в моем стиле</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Цели и решения</span><br><span style="font-size:11px; color:var(--text-muted)">К чему я иду и зачем</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Другое</span><br><span style="font-size:11px; color:var(--text-muted)">Напишите своими словами</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="Следить за тем, что я читаю" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">В чем вы сильны? Навыки, сильные стороны, с чем к вам обычно приходят.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Рисую животных, просто объясняю сложное, быстро работаю под дедлайн"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Что для вас важно и от какой работы вы отказываетесь?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Честная работа, честная оплата. Не беру клиентов из азартных игр и табака."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Как вам проще всего воспринимать информацию?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Короткие списки</button>
        <button type="button" class="elicit-pill" data-value="Examples">Примеры</button>
        <button type="button" class="elicit-pill" data-value="Step by step">По шагам</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Картинки и схемы</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Другое</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Голосовые, которые можно послушать" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Когда вам лучше всего работается?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Рано утром</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Ближе к обеду</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Днем</button>
        <button type="button" class="elicit-pill" data-value="Night">Ночью</button>
        <button type="button" class="elicit-pill" data-value="It changes">По-разному</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Что вас выматывает? Долгие созвоны, куча сообщений, бумажная работа по пятницам"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Как ваш агент должен с вами общаться?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Коротко и просто</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Подробно</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Дружелюбно и неформально</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Официально и по-деловому</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Другое</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Прямо, с долей юмора" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Где вы живете? Необязательно, это нужно для часового пояса.</label>
      <input type="text" data-name="city" placeholder="Санкт-Петербург, Россия">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Есть ссылка, где рассказано о вас? Ваш агент прочитает ее, и вам придется меньше печатать.</label>
      <input type="text" data-name="link" placeholder="https://вашсайт.рф">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Пропустить</button>
    <button type="button" class="elicit-submit">Дальше</button>
  </div>
</form>
