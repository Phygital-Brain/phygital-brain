    <div class="elicit-group">

    </div>

      <label class="elicit-question">Which publishers or clients have you worked with?</label>

    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Кто ваши клиенты?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">

        <button type="button" class="elicit-pill" data-value="Other" data-other>Другое</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Школы" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Как вас чаще всего находят клиенты?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">По рекомендациям и сарафанному радио</button>
        <button type="button" class="elicit-pill" data-value="Social media">Через соцсети</button>

        <button type="button" class="elicit-pill" data-value="Other" data-other>Другое</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Книжные ярмарки" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Что вас больше всего тормозит?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Поиск клиентов</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Бумажная работа, сметы и счета</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Регулярно публиковать контент</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Слишком много сервисов, заметки разбросаны</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Или скажите своими словами"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Какая у вас главная цель на ближайшие 12 месяцев?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Зарабатывать больше</button>
        <button type="button" class="elicit-pill" data-value="More free time">Больше свободного времени</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Запустить что-то новое</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Навести порядок в делах</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Или своими словами: подписать договор на первую книгу"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Какие сферы для вас сейчас важнее всего?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Карьера или работа</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Учеба</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Творческие проекты</button>
        <button type="button" class="elicit-pill" data-value="Side project">Проект для себя</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Другое</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Здоровье и спорт" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Что вас больше всего тормозит?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Много идей, но до дела не доходит</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Заметки разбросаны</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Забываю детали о людях</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">Нет четких целей</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Или скажите своими словами"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Какая у вас главная цель на ближайшие 12 месяцев?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Вырасти в карьере</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Закончить большой проект</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Освоить новый навык</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Навести порядок в делах</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Или своими словами: снять свой первый короткий метр"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">Над чем вы сейчас работаете? До 3 проектов, по одному в строке.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Новая книжка с картинками для издательства&#10;Сайт-портфолио&#10;Коплю на мастерскую"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Что вас сейчас беспокоит больше всего?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Два дедлайна на одной неделе, и некогда искать новые заказы"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Пропустить</button>
