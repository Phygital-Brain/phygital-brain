    <div class="elicit-group">

      <div class="elicit-pills" data-name="you" data-multi="false">

        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">مشاريع شخصية</span><br><span style="font-size:11px; color:var(--text-muted)">دراسة، هوايات، مشاريع جانبية</span></span></button>

      <input type="text" class="elicit-other" data-for="you" placeholder="معلم يبيع دورات تدريبية كعمل جانبي" hidden>

        <button type="button" class="elicit-pill" data-value="Yes, products">نعم، منتجات</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">ليس بعد، لكني أخطط لذلك</button>
        <button type="button" class="elicit-pill" data-value="No">لا</button>
      </div>
    </div>
    <div class="elicit-group">

        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">الكتابة نيابةً عني</span><br><span style="font-size:11px; color:var(--text-muted)">رسائل ومنشورات بأسلوبي</span></span></button>

    <div class="elicit-group">

      <textarea class="elicit-textarea" data-name="strengths" placeholder="رسم الحيوانات، شرح الأفكار ببساطة، العمل بسرعة تحت ضغط المواعيد"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ما المبادئ التي تتمسك بها، وما الأعمال التي ترفضها؟</label>

    <div class="elicit-group">
      <label class="elicit-question">كيف تستوعب المعلومات بشكل أفضل؟</label>

        <button type="button" class="elicit-pill" data-value="Examples">أمثلة</button>
        <button type="button" class="elicit-pill" data-value="Step by step">خطوة بخطوة</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">صور ورسوم توضيحية</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غير ذلك</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="تسجيلات صوتية أستمع إليها" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">متى تركّز بشكل أفضل؟</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">الصباح الباكر</button>
        <button type="button" class="elicit-pill" data-value="Late morning">قبل الظهر</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">بعد الظهر</button>
        <button type="button" class="elicit-pill" data-value="Night">في الليل</button>
        <button type="button" class="elicit-pill" data-value="It changes">يختلف</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="ما الذي يرهقك؟ المكالمات الطويلة، كثرة الرسائل، الأعمال الإدارية يوم الخميس"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">كيف تريد أن يكلمك مساعدك الذكي؟</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">باختصار ووضوح</button>
        <button type="button" class="elicit-pill" data-value="Detailed">بالتفصيل</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">بودّ وبلا تكلّف</button>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">أين تقيم؟ اختياري، ويحدد منطقتك الزمنية.</label>

      <label class="elicit-question">عندك رابط يعرّف بك؟ يقرؤه مساعدك الذكي لتكتب أقل.</label>

    </div>

  <div class="elicit-footer">
    <button type="button" class="elicit-skip">تخطي</button>
    <button type="button" class="elicit-submit">متابعة</button>
  </div>
</form>
