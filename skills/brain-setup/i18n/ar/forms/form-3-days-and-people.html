<h2 class="sr-only">نموذج الإعداد 3 من 4: أيامك والأشخاص في حياتك.</h2>
<form class="elicit" dir="rtl">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>تفاصيل عقلك الثاني: أيامك والأشخاص (3 من 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">ما أيام عملك؟</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">الإثنين</button>
        <button type="button" class="elicit-pill" data-value="Tue">الثلاثاء</button>
        <button type="button" class="elicit-pill" data-value="Wed">الأربعاء</button>
        <button type="button" class="elicit-pill" data-value="Thu">الخميس</button>
        <button type="button" class="elicit-pill" data-value="Fri">الجمعة</button>
        <button type="button" class="elicit-pill" data-value="Sat">السبت</button>
        <button type="button" class="elicit-pill" data-value="Sun">الأحد</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">متى تريد أن يكون موجز الصباح جاهزًا؟</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">بدون موجز</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غير ذلك</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">من أهم الأشخاص في عملك الآن؟ حتى 3 أسماء، كل اسم في سطر.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="مريم، محررتي في دار النشر&#10;عمر، شريكي في الاستوديو&#10;ليلى، وكيلتي الأدبية"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">مع من تعمل؟</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">العملاء</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">المتعاونون</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">فريق أو مستقلون</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">شركاء أو صحافة أو أماكن عرض</button>
        <button type="button" class="elicit-pill" data-value="Just me">أنا فقط</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غير ذلك</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="الطلاب" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">اكتب حساباتك على وسائل التواصل، للعمل أو للمشاريع الشخصية.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/sara.draws (للعمل)&#10;linkedin.com/in/sarakhalil&#10;tiktok.com/@sarasketchbook (شخصي)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">أين تتواصل مع الناس؟</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail أو Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook أو Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack أو Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غير ذلك</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">أين توجد ملاحظاتك وأعمالك اليوم؟</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive أو Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva أو Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">جداول البيانات</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">دفاتر ورقية</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غير ذلك</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">بأي أسلوب تريد أن تبدو في كتاباتك؟</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">دافئ وشخصي</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">مباشر وواثق</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">متواضع وصادق</button>
        <button type="button" class="elicit-pill" data-value="Playful">مرح</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غير ذلك</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="كأني أكلم صديقًا" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">تخطي</button>
    <button type="button" class="elicit-submit">متابعة</button>
  </div>
</form>
