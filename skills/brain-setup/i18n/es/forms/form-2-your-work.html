    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">

        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>

        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>

    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">¿Quiénes son tus clientes?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">Empresas y marcas</button>
        <button type="button" class="elicit-pill" data-value="Agencies">Agencias</button>
        <button type="button" class="elicit-pill" data-value="Individuals">Particulares</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Otros creadores</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Otro</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Colegios" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">¿Cómo te encuentran la mayoría de tus clientes?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">Recomendaciones y boca a boca</button>
        <button type="button" class="elicit-pill" data-value="Social media">Redes sociales</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">Yo los contacto</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">Plataformas o marketplaces</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Otro</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Ferias del libro" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">¿Qué es lo que más te frena?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Conseguir clientes</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Papeleo, presupuestos y facturas</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Publicar contenido con regularidad</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Demasiadas herramientas y notas por todas partes</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="O dilo con tus palabras"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">¿Cuál es tu objetivo principal para los próximos 12 meses?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Ganar más</button>
        <button type="button" class="elicit-pill" data-value="More free time">Tener más tiempo libre</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Lanzar algo nuevo</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Organizarme</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="O dilo con tus palabras: firmar mi primer contrato editorial"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">¿Qué áreas te importan más ahora mismo?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Carrera o trabajo</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Aprendizaje o estudios</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Proyectos creativos</button>
        <button type="button" class="elicit-pill" data-value="Side project">Proyecto paralelo</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Otro</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Salud y deporte" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">¿Qué es lo que más te frena?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Muchas ideas y pocas terminadas</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Notas por todas partes</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Olvidar detalles de las personas</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">No tener objetivos claros</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="O dilo con tus palabras"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">¿Cuál es tu objetivo principal para los próximos 12 meses?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Crecer en mi carrera</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Terminar un proyecto grande</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Aprender una nueva habilidad</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Organizarme</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="O dilo con tus palabras: terminar mi primer cortometraje"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">¿En qué estás trabajando ahora? Hasta 3, uno por línea.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Nuevo libro ilustrado para una editorial&#10;Web de portafolio&#10;Ahorrar para un estudio"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">¿Qué es lo que más te preocupa ahora mismo?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Dos entregas en la misma semana y nada de tiempo para buscar trabajo nuevo"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Saltar</button>
    <button type="button" class="elicit-submit">Continuar</button>
  </div>
</form>
