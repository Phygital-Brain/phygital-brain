<h2 class="sr-only">Fomu ya kuanza 3 kati ya 4: siku zako na watu wako.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Maelezo ya ubongo: siku zako na watu wako (3 kati ya 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Unafanya kazi siku gani?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Jumatatu</button>
        <button type="button" class="elicit-pill" data-value="Tue">Jumanne</button>
        <button type="button" class="elicit-pill" data-value="Wed">Jumatano</button>
        <button type="button" class="elicit-pill" data-value="Thu">Alhamisi</button>
        <button type="button" class="elicit-pill" data-value="Fri">Ijumaa</button>
        <button type="button" class="elicit-pill" data-value="Sat">Jumamosi</button>
        <button type="button" class="elicit-pill" data-value="Sun">Jumapili</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Muhtasari wako wa asubuhi uwe tayari saa ngapi?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Sitaki muhtasari</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Nyingine</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Ni nani muhimu zaidi katika kazi yako sasa hivi? Hadi majina 3, kila jina mstari wake.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Neema, mhariri wangu kwa mchapishaji&#10;Baraka, mbia wangu wa studio&#10;Zawadi, wakala wangu wa kazi"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Unafanya kazi na nani?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Wateja</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Washirika</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Timu au wafanyakazi huru</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Wadau, vyombo vya habari au kumbi</button>
        <button type="button" class="elicit-pill" data-value="Just me">Ni mimi tu</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Nyingine</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Wanafunzi" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Orodhesha mitandao yako ya kijamii, ya kazi au ya miradi binafsi.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/amina.anachora (kazi)&#10;linkedin.com/in/aminawanjiru&#10;tiktok.com/@aminamichoro (binafsi)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Unawasiliana na watu wapi?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail au Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook au Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack au Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Nyingine</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Noti na kazi zako zinakaa wapi kwa sasa?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive au Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva au Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Majedwali (Excel, Sheets)</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Madaftari</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Nyingine</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Unataka maandishi yako yasikike vipi?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Ya uchangamfu na ya karibu</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Ya wazi na ya kujiamini</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Ya unyenyekevu na ukweli</button>
        <button type="button" class="elicit-pill" data-value="Playful">Yenye utani</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Nyingine</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Kama ninavyoongea na rafiki" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Ruka</button>
    <button type="button" class="elicit-submit">Endelea</button>
  </div>
</form>
