<h2 class="sr-only">فرم راه‌اندازی 1 از 4: درباره شما.</h2>
<form class="elicit" dir="rtl">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>جزئیات مغز دوم: درباره شما (1 از 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">اسمتان چیست و در یک خط، چه کاری می‌کنید؟</label>
      <input type="text" data-name="name" placeholder="سارا احمدی، تصویرگر کتاب کودک">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">کدام بیشتر شما را توصیف می‌کند؟</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">فریلنسر یا تولیدکننده محتوا</span><br><span style="font-size:11px; color:var(--text-muted)">برای خودش کار می‌کند</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">صاحب کسب‌وکار کوچک</span><br><span style="font-size:11px; color:var(--text-muted)">شرکت یک‌نفره یا خیلی کوچک</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">کارمند یا متخصص</span><br><span style="font-size:11px; color:var(--text-muted)">برای یک شرکت کار می‌کند</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">پروژه‌های شخصی</span><br><span style="font-size:11px; color:var(--text-muted)">درس، سرگرمی، پروژه‌های جانبی</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">غیره</span><br><span style="font-size:11px; color:var(--text-muted)">با کلمه‌های خودتان بنویسید</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="معلمی که کنار کارش دوره هم می‌فروشد" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">چیزی می‌فروشید یا مشتری دارید؟</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">بله، خدمات یا مشتری</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">بله، محصول</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">هنوز نه، ولی قصدش را دارم</button>
        <button type="button" class="elicit-pill" data-value="No">نه</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">مغز دوم در چه کارهایی کمکتان کند؟</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">مرتب کردن پروژه‌ها</span><br><span style="font-size:11px; color:var(--text-muted)">برنامه‌ها، وضعیت، قدم‌های بعدی</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">به یاد داشتن آدم‌ها</span><br><span style="font-size:11px; color:var(--text-muted)">مشتری‌ها، همکاران، آشناها</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">به جای من بنویسد</span><br><span style="font-size:11px; color:var(--text-muted)">ایمیل و پست با لحن خودم</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">هدف‌ها و تصمیم‌ها</span><br><span style="font-size:11px; color:var(--text-muted)">دنبال چه هستم و چرا</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">غیره</span><br><span style="font-size:11px; color:var(--text-muted)">با کلمه‌های خودتان بنویسید</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="پیگیری کتاب‌هایی که می‌خوانم" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">در چه کاری خوبید؟ مهارت‌ها، نقاط قوت، کارهایی که مردم برایش سراغ شما می‌آیند.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="کشیدن حیوانات، ساده توضیح دادن ایده‌ها، کار سریع وقتی ددلاین نزدیک است"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">به چه چیزی پایبندید و به چه کارهایی نه می‌گویید؟</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="کار صادقانه، دستمزد منصفانه. مشتری شرط‌بندی یا دخانیات قبول نمی‌کنم."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">چطور چیزها را راحت‌تر می‌فهمید؟</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">فهرست‌های کوتاه</button>
        <button type="button" class="elicit-pill" data-value="Examples">مثال</button>
        <button type="button" class="elicit-pill" data-value="Step by step">قدم‌به‌قدم</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">عکس و نمودار</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غیره</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="پیام صوتی که بتوانم گوش بدهم" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">کِی بهتر تمرکز می‌کنید؟</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">صبح زود</button>
        <button type="button" class="elicit-pill" data-value="Late morning">نزدیک ظهر</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">بعدازظهر</button>
        <button type="button" class="elicit-pill" data-value="Night">شب</button>
        <button type="button" class="elicit-pill" data-value="It changes">فرق می‌کند</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="چه چیزی خسته‌تان می‌کند؟ تماس‌های طولانی، پیام‌های زیاد، کارهای اداری پنج‌شنبه‌ها"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">دستیارتان چطور با شما حرف بزند؟</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">کوتاه و ساده</button>
        <button type="button" class="elicit-pill" data-value="Detailed">با جزئیات</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">دوستانه و خودمانی</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">رسمی و حرفه‌ای</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>غیره</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="رک، با کمی شوخ‌طبعی" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">کجا زندگی می‌کنید؟ اختیاری است، منطقه زمانی‌تان با آن تنظیم می‌شود.</label>
      <input type="text" data-name="city" placeholder="تهران، ایران">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">لینکی دارید که شما را معرفی کند؟ دستیارتان آن را می‌خواند تا کمتر تایپ کنید.</label>
      <input type="text" data-name="link" placeholder="https://yoursite.ir">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">رد کردن</button>
    <button type="button" class="elicit-submit">ادامه</button>
  </div>
</form>
