<h2 class="sr-only">设置表单 2/4：你的工作。</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>大脑信息：你的工作（2/4）</span>
  </div>
  <div class="elicit-body">
    <!-- JOB QUESTIONS: replace this whole block, down to END JOB QUESTIONS, with 3 questions written for the person's own work (see SKILL.md, Form 2). Example for an illustrator:
    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Per project">Per project</button>
        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>
    END JOB QUESTIONS -->
    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">你的客户是谁？</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">企业和品牌</button>
        <button type="button" class="elicit-pill" data-value="Agencies">代理公司</button>
        <button type="button" class="elicit-pill" data-value="Individuals">个人</button>
        <button type="button" class="elicit-pill" data-value="Other creators">其他创作者</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="学校" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">大多数客户是怎么找到你的？</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">朋友介绍和口碑</button>
        <button type="button" class="elicit-pill" data-value="Social media">社交媒体</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">我主动联系他们</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">接单平台或网店平台</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="书展" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">什么最拖慢你？</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">找客户</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">杂事、报价和开发票</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">坚持定期发内容</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">工具太多，笔记东一块西一块</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="或者用你自己的话说"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">未来 12 个月，你最主要的目标是什么？</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">多赚钱</button>
        <button type="button" class="elicit-pill" data-value="More free time">多点自由时间</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">推出新东西</button>
        <button type="button" class="elicit-pill" data-value="Get organised">把事情理清楚</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="或者用你自己的话说：签下我的第一份出书合同"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">现在哪些方面对你最重要？</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">事业或工作</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">学习或进修</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">创作项目</button>
        <button type="button" class="elicit-pill" data-value="Side project">业余项目</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="健康和运动" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">什么最拖慢你？</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">想法太多，落不了地</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">笔记太分散</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">记不住别人的细节</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">目标不清楚</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="或者用你自己的话说"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">未来 12 个月，你最主要的目标是什么？</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">事业更上一层楼</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">完成一个大项目</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">学一门新技能</button>
        <button type="button" class="elicit-pill" data-value="Get organised">把事情理清楚</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="或者用你自己的话说：拍完我的第一部短片"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">你现在在忙什么？最多 3 个，每行一个。</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="给出版社画的新绘本&#10;作品集网站&#10;攒钱开工作室"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">你现在最担心什么？</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="同一周要交两个稿，没时间找新活"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">跳过</button>
    <button type="button" class="elicit-submit">继续</button>
  </div>
</form>
