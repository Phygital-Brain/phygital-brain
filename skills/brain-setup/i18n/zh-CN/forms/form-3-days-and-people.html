<h2 class="sr-only">设置表单 3/4：你的日常和身边的人。</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>大脑信息：你的日常和身边的人（3/4）</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">你哪几天工作？</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">周一</button>
        <button type="button" class="elicit-pill" data-value="Tue">周二</button>
        <button type="button" class="elicit-pill" data-value="Wed">周三</button>
        <button type="button" class="elicit-pill" data-value="Thu">周四</button>
        <button type="button" class="elicit-pill" data-value="Fri">周五</button>
        <button type="button" class="elicit-pill" data-value="Sat">周六</button>
        <button type="button" class="elicit-pill" data-value="Sun">周日</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">晨间简报几点准备好？</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">不要简报</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">现在工作中对你最重要的人是谁？最多 3 个名字，每行一个。</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="王敏，出版社的编辑&#10;张磊，工作室合伙人&#10;李娜，我的经纪人"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">你和谁一起工作？</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">客户</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">合作者</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">团队或自由职业者</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">合作伙伴、媒体或场地方</button>
        <button type="button" class="elicit-pill" data-value="Just me">只有我自己</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="学生" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">列出你的社交媒体账号，工作用的、个人项目用的都可以。</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="小红书 @林晓画画（工作）&#10;微博 @林晓的绘本&#10;抖音 @林晓速写本（个人）"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">你平时在哪里跟人沟通？</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail 或 Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook 或 Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack 或 Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">你现在的笔记和工作资料都放在哪里？</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google 云端硬盘或 Google 文档</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">苹果备忘录</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva 或 Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">电子表格</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">纸质笔记本</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="印象笔记" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">你希望自己写出来的东西是什么语气？</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">温暖亲切</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">直接自信</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">谦虚真诚</button>
        <button type="button" class="elicit-pill" data-value="Playful">俏皮有趣</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="像跟朋友聊天一样" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">跳过</button>
    <button type="button" class="elicit-submit">继续</button>
  </div>
</form>
