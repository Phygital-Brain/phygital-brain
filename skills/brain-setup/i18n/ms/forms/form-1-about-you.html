  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Siapa nama anda, dan apa kerja anda dalam satu baris?</label>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">Yang mana paling sesuai dengan anda?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Pekerja bebas atau pencipta kandungan</span><br><span style="font-size:11px; color:var(--text-muted)">Bekerja sendiri</span></span></button>

        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Pekerja makan gaji atau profesional</span><br><span style="font-size:11px; color:var(--text-muted)">Bekerja dengan syarikat</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Projek peribadi</span><br><span style="font-size:11px; color:var(--text-muted)">Pengajian, hobi, projek sampingan</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Lain-lain</span><br><span style="font-size:11px; color:var(--text-muted)">Tulis dengan ayat anda sendiri</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Cikgu yang menjual kursus secara sambilan" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Adakah anda menjual sesuatu atau ada klien?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Ya, perkhidmatan atau klien</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Ya, produk</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Belum lagi, tapi ada rancangan</button>
        <button type="button" class="elicit-pill" data-value="No">Tidak</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Otak kedua anda patut bantu dalam hal apa?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Susun projek</span><br><span style="font-size:11px; color:var(--text-muted)">Rancangan, status, langkah seterusnya</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Ingat orang</span><br><span style="font-size:11px; color:var(--text-muted)">Klien, kolaborator, kenalan</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Tulis untuk saya</span><br><span style="font-size:11px; color:var(--text-muted)">E-mel dan hantaran dengan gaya saya</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Matlamat dan keputusan</span><br><span style="font-size:11px; color:var(--text-muted)">Apa yang saya kejar dan kenapa</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Lain-lain</span><br><span style="font-size:11px; color:var(--text-muted)">Tulis dengan ayat anda sendiri</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="Catat buku yang saya baca" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Apa yang anda pandai buat? Kemahiran, kekuatan, perkara yang orang selalu minta bantuan anda.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Melukis haiwan, menerangkan idea dengan mudah, bekerja pantas bila tarikh akhir dekat"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Apa prinsip anda, dan kerja apa yang anda tolak?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Kerja jujur, bayaran adil. Tiada klien judi atau tembakau."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bagaimana anda paling mudah faham sesuatu?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Senarai pendek</button>
        <button type="button" class="elicit-pill" data-value="Examples">Contoh</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Langkah demi langkah</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Gambar dan rajah</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Nota suara yang saya boleh dengar" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bila anda paling fokus?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Awal pagi</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Lewat pagi</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Petang</button>
        <button type="button" class="elicit-pill" data-value="Night">Malam</button>
        <button type="button" class="elicit-pill" data-value="It changes">Tak tentu</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Apa yang memenatkan anda? Panggilan panjang, terlalu banyak mesej, kerja pentadbiran pada hari Jumaat"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Bagaimana ejen anda patut bercakap dengan anda?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Ringkas dan mudah</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Terperinci</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Mesra dan santai</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Formal dan profesional</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Terus terang, dengan sedikit jenaka" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Anda tinggal di mana? Tidak wajib, ini untuk tetapkan zon waktu anda.</label>
      <input type="text" data-name="city" placeholder="Kuala Lumpur, Malaysia">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ada pautan yang menerangkan tentang anda? Ejen anda akan membacanya supaya anda tak perlu taip banyak.</label>
      <input type="text" data-name="link" placeholder="https://lamananda.com.my">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Langkau</button>
    <button type="button" class="elicit-submit">Teruskan</button>
  </div>
</form>
