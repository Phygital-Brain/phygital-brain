<h2 class="sr-only">Borang persediaan 3 daripada 4: hari dan orang di sekeliling anda.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Butiran otak: hari dan orang di sekeliling anda (3 daripada 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Hari apa anda bekerja?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Isn</button>
        <button type="button" class="elicit-pill" data-value="Tue">Sel</button>
        <button type="button" class="elicit-pill" data-value="Wed">Rab</button>
        <button type="button" class="elicit-pill" data-value="Thu">Kha</button>
        <button type="button" class="elicit-pill" data-value="Fri">Jum</button>
        <button type="button" class="elicit-pill" data-value="Sat">Sab</button>
        <button type="button" class="elicit-pill" data-value="Sun">Ahd</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Bila taklimat pagi anda patut siap?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Tak perlu taklimat</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Siapa yang paling penting dalam kerja anda sekarang? Paling banyak 3 nama, satu baris setiap seorang.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, editor saya di syarikat penerbitan&#10;João, rakan kongsi studio&#10;Lia, ejen saya"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Anda bekerja dengan siapa?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Klien</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Kolaborator</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Pasukan atau pekerja bebas</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Rakan kongsi, media atau tempat acara</button>
        <button type="button" class="elicit-pill" data-value="Just me">Saya seorang sahaja</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Pelajar" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Senaraikan media sosial anda, untuk kerja atau projek peribadi.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (kerja)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (peribadi)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Di mana anda berhubung dengan orang?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail atau Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook atau Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack atau Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Di mana nota dan kerja anda disimpan sekarang?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive atau Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva atau Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Hamparan</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Buku nota kertas</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Bagaimana anda mahu tulisan anda kedengaran?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Mesra dan peribadi</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Terus terang dan yakin</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Rendah diri dan jujur</button>
        <button type="button" class="elicit-pill" data-value="Playful">Ceria dan bersahaja</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Lain-lain</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Macam saya bercakap dengan kawan" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Langkau</button>
    <button type="button" class="elicit-submit">Teruskan</button>
  </div>
</form>
