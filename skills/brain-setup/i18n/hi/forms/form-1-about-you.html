<h2 class="sr-only">सेटअप फ़ॉर्म 4 में से 1: आपके बारे में।</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>ब्रेन की जानकारी: आपके बारे में (4 में से 1)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">आपका नाम क्या है, और आप क्या करते हैं, एक लाइन में?</label>
      <input type="text" data-name="name" placeholder="अनन्या शर्मा, बच्चों की किताबों की इलस्ट्रेटर">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आप पर सबसे सही क्या बैठता है?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">फ़्रीलांसर या क्रिएटर</span><br><span style="font-size:11px; color:var(--text-muted)">अपने लिए खुद काम करते हैं</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">छोटे बिज़नेस के मालिक</span><br><span style="font-size:11px; color:var(--text-muted)">अकेले या बहुत छोटी कंपनी</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">नौकरीपेशा या प्रोफ़ेशनल</span><br><span style="font-size:11px; color:var(--text-muted)">किसी कंपनी में काम करते हैं</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">निजी प्रोजेक्ट</span><br><span style="font-size:11px; color:var(--text-muted)">पढ़ाई, शौक, साइड प्रोजेक्ट</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">कुछ और</span><br><span style="font-size:11px; color:var(--text-muted)">अपने शब्दों में लिखें</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="टीचर, और साइड में ऑनलाइन कोर्स" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">क्या आप कुछ बेचते हैं या आपके क्लाइंट हैं?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">हाँ, सेवाएँ या क्लाइंट</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">हाँ, प्रोडक्ट</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">अभी नहीं, पर सोच रहे हैं</button>
        <button type="button" class="elicit-pill" data-value="No">नहीं</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आपका सेकंड ब्रेन किस काम में मदद करे?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">प्रोजेक्ट संभालना</span><br><span style="font-size:11px; color:var(--text-muted)">प्लान, स्टेटस, अगला कदम</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">लोगों को याद रखना</span><br><span style="font-size:11px; color:var(--text-muted)">क्लाइंट, सहयोगी, संपर्क</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">मेरे लिए लिखना</span><br><span style="font-size:11px; color:var(--text-muted)">मेरे अंदाज़ में ईमेल और पोस्ट</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">लक्ष्य और फ़ैसले</span><br><span style="font-size:11px; color:var(--text-muted)">मेरा लक्ष्य क्या है और क्यों</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">कुछ और</span><br><span style="font-size:11px; color:var(--text-muted)">अपने शब्दों में लिखें</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="अपनी पढ़ी किताबों का हिसाब रखना" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आप किसमें अच्छे हैं? हुनर, खूबियाँ, लोग किस काम के लिए आपके पास आते हैं।</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="जानवरों के चित्र बनाना, बातें आसानी से समझाना, डेडलाइन में तेज़ी से काम करना"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आप किन बातों पर टिके रहते हैं, और किस काम को मना कर देते हैं?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="ईमानदार काम, सही पैसे। जुए या तंबाकू वाले क्लाइंट नहीं।"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आपको चीज़ें सबसे अच्छे से कैसे समझ आती हैं?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">छोटी लिस्ट</button>
        <button type="button" class="elicit-pill" data-value="Examples">उदाहरण</button>
        <button type="button" class="elicit-pill" data-value="Step by step">एक-एक कदम करके</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">तस्वीरें और डायग्राम</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="वॉइस नोट जो मैं सुन सकूँ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आपका ध्यान सबसे अच्छा कब लगता है?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">सुबह-सुबह</button>
        <button type="button" class="elicit-pill" data-value="Late morning">दोपहर से पहले</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">दोपहर</button>
        <button type="button" class="elicit-pill" data-value="Night">रात</button>
        <button type="button" class="elicit-pill" data-value="It changes">बदलता रहता है</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="आपको क्या थका देता है? लंबी कॉल, बहुत सारे मैसेज, शुक्रवार को कागज़ी काम"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आपका एजेंट आपसे कैसे बात करे?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">छोटा और सीधा</button>
        <button type="button" class="elicit-pill" data-value="Detailed">विस्तार से</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">दोस्ताना और कैज़ुअल</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">फ़ॉर्मल और प्रोफ़ेशनल</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="सीधी बात, थोड़े मज़ाक के साथ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आप कहाँ रहते हैं? ज़रूरी नहीं, इससे आपका टाइम ज़ोन सेट होता है।</label>
      <input type="text" data-name="city" placeholder="पुणे, भारत">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आपके बारे में कोई लिंक है? आपका एजेंट उसे पढ़ लेगा, ताकि आपको कम टाइप करना पड़े।</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">छोड़ें</button>
    <button type="button" class="elicit-submit">आगे बढ़ें</button>
  </div>
</form>
