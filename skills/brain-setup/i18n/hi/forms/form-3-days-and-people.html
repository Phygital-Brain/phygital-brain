<h2 class="sr-only">सेटअप फ़ॉर्म 4 में से 3: आपके दिन और आपके लोग।</h2>

  <div class="elicit-header">

    <span>ब्रेन की जानकारी: आपके दिन और आपके लोग (4 में से 3)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">आप किन दिनों में काम करते हैं?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">सोम</button>
        <button type="button" class="elicit-pill" data-value="Tue">मंगल</button>
        <button type="button" class="elicit-pill" data-value="Wed">बुध</button>
        <button type="button" class="elicit-pill" data-value="Thu">गुरु</button>
        <button type="button" class="elicit-pill" data-value="Fri">शुक्र</button>
        <button type="button" class="elicit-pill" data-value="Sat">शनि</button>
        <button type="button" class="elicit-pill" data-value="Sun">रवि</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">आपकी मॉर्निंग ब्रीफ़ कब तक तैयार हो?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">ब्रीफ़ नहीं चाहिए</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">अभी आपके काम में सबसे अहम लोग कौन हैं? ज़्यादा से ज़्यादा 3 नाम, हर नाम एक लाइन में।</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="मीरा, पब्लिशर के यहाँ मेरी एडिटर&#10;राहुल, स्टूडियो पार्टनर&#10;लता, मेरी एजेंट"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आप किनके साथ काम करते हैं?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">क्लाइंट</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">सहयोगी</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">टीम या फ़्रीलांसर</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">पार्टनर, मीडिया या आयोजन की जगहें</button>
        <button type="button" class="elicit-pill" data-value="Just me">सिर्फ़ मैं</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="स्टूडेंट" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">अपने सोशल मीडिया लिखें, काम के या निजी प्रोजेक्ट के।</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ananya.draws (काम)&#10;linkedin.com/in/ananyasharma&#10;youtube.com/@ananyasketchbook (निजी)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आप लोगों से कहाँ बात करते हैं?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail या Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook या Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack या Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">आज आपके नोट्स और काम कहाँ रखे हैं?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive या Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva या Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">स्प्रेडशीट</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">कागज़ की नोटबुक</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">लिखते समय आपका अंदाज़ कैसा हो?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">गर्मजोशी और अपनेपन वाला</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">सीधा और आत्मविश्वास भरा</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">विनम्र और ईमानदार</button>
        <button type="button" class="elicit-pill" data-value="Playful">मज़ेदार</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>कुछ और</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="जैसे किसी दोस्त से बात होती है" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">छोड़ें</button>
    <button type="button" class="elicit-submit">आगे बढ़ें</button>
  </div>
</form>
