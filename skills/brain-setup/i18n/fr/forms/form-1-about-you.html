        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Écrire pour moi</span><br><span style="font-size:11px; color:var(--text-muted)">E-mails et posts dans mon style</span></span></button>

        <button type="button" class="elicit-pill" data-value="Afternoon">L'après-midi</button>
        <button type="button" class="elicit-pill" data-value="Night">Le soir</button>
        <button type="button" class="elicit-pill" data-value="It changes">Ça dépend</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Ce qui vous épuise ? Longs appels, trop de messages, l'administratif le vendredi"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Comment votre agent doit-il vous parler ?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Court et simple</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Détaillé</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Sympa et détendu</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Formel et professionnel</button>
