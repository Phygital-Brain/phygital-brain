<h2 class="sr-only">Formulaire de configuration 3 sur 4 : vos journées et vos contacts.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Votre cerveau : vos journées et vos contacts (3 sur 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Quels jours travaillez-vous ?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Lun</button>
        <button type="button" class="elicit-pill" data-value="Tue">Mar</button>
        <button type="button" class="elicit-pill" data-value="Wed">Mer</button>
        <button type="button" class="elicit-pill" data-value="Thu">Jeu</button>
        <button type="button" class="elicit-pill" data-value="Fri">Ven</button>
        <button type="button" class="elicit-pill" data-value="Sat">Sam</button>
        <button type="button" class="elicit-pill" data-value="Sun">Dim</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">À quelle heure votre point du matin doit-il être prêt ?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Pas de point du matin</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Autre</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Qui compte le plus dans votre travail en ce moment ? 3 noms au maximum, un par ligne.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Claire, mon éditrice&#10;Hugo, mon associé à l'atelier&#10;Inès, mon agente"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Avec qui travaillez-vous ?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Clients</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Collaborateurs</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Équipe ou freelances</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partenaires, presse ou lieux</button>
        <button type="button" class="elicit-pill" data-value="Just me">Juste moi</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Autre</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Élèves" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Vos réseaux sociaux, pour le travail ou vos projets perso.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/lea.dessine (pro)&#10;linkedin.com/in/leamartin&#10;tiktok.com/@carnetdelea (perso)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Où échangez-vous avec les gens ?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail ou Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook ou Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack ou Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Autre</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Où sont vos notes et votre travail aujourd'hui ?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive ou Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Notes d'Apple</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva ou Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Tableurs</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Carnets papier</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Autre</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Quel ton voulez-vous avoir à l'écrit ?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Chaleureux et personnel</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Direct et sûr de moi</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Modeste et sincère</button>
        <button type="button" class="elicit-pill" data-value="Playful">Léger et ludique</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Autre</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Comme je parle à un ami" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Passer</button>
    <button type="button" class="elicit-submit">Continuer</button>
  </div>
</form>
