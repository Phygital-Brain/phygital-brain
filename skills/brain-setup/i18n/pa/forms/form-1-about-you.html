<h2 class="sr-only">ਸੈੱਟਅੱਪ ਫ਼ਾਰਮ 4 ਵਿੱਚੋਂ 1: ਤੁਹਾਡੇ ਬਾਰੇ।</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>ਬ੍ਰੇਨ ਦੀ ਜਾਣਕਾਰੀ: ਤੁਹਾਡੇ ਬਾਰੇ (4 ਵਿੱਚੋਂ 1)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਡਾ ਨਾਂ ਕੀ ਹੈ, ਅਤੇ ਤੁਸੀਂ ਕੀ ਕੰਮ ਕਰਦੇ ਹੋ? ਇੱਕ ਲਾਈਨ ਵਿੱਚ।</label>
      <input type="text" data-name="name" placeholder="ਸਿਮਰਨ ਗਿੱਲ, ਬੱਚਿਆਂ ਦੀਆਂ ਕਿਤਾਬਾਂ ਲਈ ਚਿੱਤਰਕਾਰ">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਡੇ ਉੱਤੇ ਸਭ ਤੋਂ ਵੱਧ ਕੀ ਢੁੱਕਦਾ ਹੈ?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਫ਼੍ਰੀਲਾਂਸਰ ਜਾਂ ਕ੍ਰਿਏਟਰ</span><br><span style="font-size:11px; color:var(--text-muted)">ਆਪਣਾ ਖ਼ੁਦ ਦਾ ਕੰਮ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਛੋਟਾ ਕਾਰੋਬਾਰ</span><br><span style="font-size:11px; color:var(--text-muted)">ਇੱਕ ਬੰਦੇ ਦੀ ਜਾਂ ਬਹੁਤ ਛੋਟੀ ਕੰਪਨੀ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਮੁਲਾਜ਼ਮ ਜਾਂ ਪ੍ਰੋਫ਼ੈਸ਼ਨਲ</span><br><span style="font-size:11px; color:var(--text-muted)">ਕਿਸੇ ਕੰਪਨੀ ਵਿੱਚ ਨੌਕਰੀ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਨਿੱਜੀ ਪ੍ਰੋਜੈਕਟ</span><br><span style="font-size:11px; color:var(--text-muted)">ਪੜ੍ਹਾਈ, ਸ਼ੌਕ, ਸਾਈਡ ਪ੍ਰੋਜੈਕਟ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਹੋਰ</span><br><span style="font-size:11px; color:var(--text-muted)">ਆਪਣੇ ਸ਼ਬਦਾਂ ਵਿੱਚ ਲਿਖੋ</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="ਅਧਿਆਪਕ, ਨਾਲ-ਨਾਲ ਆਨਲਾਈਨ ਕੋਰਸਾਂ ਦਾ ਕੰਮ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਕੀ ਤੁਸੀਂ ਕੁਝ ਵੇਚਦੇ ਹੋ ਜਾਂ ਤੁਹਾਡੇ ਕਲਾਇੰਟ ਹਨ?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">ਹਾਂ, ਸੇਵਾਵਾਂ ਜਾਂ ਕਲਾਇੰਟ</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">ਹਾਂ, ਚੀਜ਼ਾਂ (ਪ੍ਰੋਡਕਟ)</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">ਹਾਲੇ ਨਹੀਂ, ਪਰ ਇਰਾਦਾ ਹੈ</button>
        <button type="button" class="elicit-pill" data-value="No">ਨਹੀਂ</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਡਾ ਸੈਕੰਡ ਬ੍ਰੇਨ ਕਿਹੜੇ ਕੰਮਾਂ ਵਿੱਚ ਮਦਦ ਕਰੇ?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਪ੍ਰੋਜੈਕਟ ਸੰਭਾਲਣਾ</span><br><span style="font-size:11px; color:var(--text-muted)">ਪਲਾਨ, ਸਥਿਤੀ, ਅਗਲੇ ਕਦਮ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਲੋਕਾਂ ਨੂੰ ਯਾਦ ਰੱਖਣਾ</span><br><span style="font-size:11px; color:var(--text-muted)">ਕਲਾਇੰਟ, ਸਹਿਯੋਗੀ, ਸੰਪਰਕ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਮੇਰੇ ਲਈ ਲਿਖਣਾ</span><br><span style="font-size:11px; color:var(--text-muted)">ਮੇਰੇ ਅੰਦਾਜ਼ ਵਿੱਚ ਈਮੇਲਾਂ ਅਤੇ ਪੋਸਟਾਂ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਟੀਚੇ ਅਤੇ ਫ਼ੈਸਲੇ</span><br><span style="font-size:11px; color:var(--text-muted)">ਮੇਰਾ ਨਿਸ਼ਾਨਾ ਕੀ ਹੈ ਅਤੇ ਕਿਉਂ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ਹੋਰ</span><br><span style="font-size:11px; color:var(--text-muted)">ਆਪਣੇ ਸ਼ਬਦਾਂ ਵਿੱਚ ਲਿਖੋ</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="ਮੇਰੀਆਂ ਪੜ੍ਹੀਆਂ ਕਿਤਾਬਾਂ ਦਾ ਹਿਸਾਬ ਰੱਖਣਾ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਸੀਂ ਕਿਸ ਕੰਮ ਵਿੱਚ ਚੰਗੇ ਹੋ? ਹੁਨਰ, ਖ਼ੂਬੀਆਂ, ਲੋਕ ਤੁਹਾਡੇ ਕੋਲ ਕਿਸ ਚੀਜ਼ ਲਈ ਆਉਂਦੇ ਹਨ।</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="ਜਾਨਵਰਾਂ ਦੇ ਚਿੱਤਰ ਬਣਾਉਣਾ, ਗੱਲਾਂ ਸੌਖੇ ਢੰਗ ਨਾਲ ਸਮਝਾਉਣਾ, ਡੈੱਡਲਾਈਨ ਵਿੱਚ ਤੇਜ਼ੀ ਨਾਲ ਕੰਮ ਕਰਨਾ"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਡੇ ਲਈ ਕਿਹੜੀਆਂ ਗੱਲਾਂ ਅਹਿਮ ਹਨ, ਅਤੇ ਕਿਹੜੇ ਕੰਮ ਨੂੰ ਤੁਸੀਂ ਨਾਂਹ ਕਰਦੇ ਹੋ?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="ਇਮਾਨਦਾਰ ਕੰਮ, ਵਾਜਬ ਪੈਸੇ। ਜੂਏ ਜਾਂ ਤੰਬਾਕੂ ਵਾਲੇ ਕਲਾਇੰਟ ਨਹੀਂ।"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਨੂੰ ਗੱਲ ਸਭ ਤੋਂ ਵਧੀਆ ਕਿਵੇਂ ਸਮਝ ਆਉਂਦੀ ਹੈ?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">ਛੋਟੀਆਂ ਲਿਸਟਾਂ</button>
        <button type="button" class="elicit-pill" data-value="Examples">ਮਿਸਾਲਾਂ</button>
        <button type="button" class="elicit-pill" data-value="Step by step">ਕਦਮ-ਦਰ-ਕਦਮ</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">ਤਸਵੀਰਾਂ ਅਤੇ ਡਾਇਗ੍ਰਾਮ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>ਹੋਰ</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="ਵੌਇਸ ਨੋਟ ਜੋ ਮੈਂ ਸੁਣ ਸਕਾਂ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਡਾ ਧਿਆਨ ਸਭ ਤੋਂ ਵੱਧ ਕਦੋਂ ਲੱਗਦਾ ਹੈ?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">ਤੜਕੇ</button>
        <button type="button" class="elicit-pill" data-value="Late morning">ਦੁਪਹਿਰ ਤੋਂ ਪਹਿਲਾਂ</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">ਦੁਪਹਿਰ</button>
        <button type="button" class="elicit-pill" data-value="Night">ਰਾਤ</button>
        <button type="button" class="elicit-pill" data-value="It changes">ਬਦਲਦਾ ਰਹਿੰਦਾ ਹੈ</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="ਤੁਹਾਨੂੰ ਕੀ ਥਕਾ ਦਿੰਦਾ ਹੈ? ਲੰਮੀਆਂ ਕਾਲਾਂ, ਬਹੁਤੇ ਮੈਸੇਜ, ਸ਼ੁੱਕਰਵਾਰ ਨੂੰ ਕਾਗ਼ਜ਼ੀ ਕੰਮ"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਹਾਡਾ ਏਜੰਟ ਤੁਹਾਡੇ ਨਾਲ ਕਿਵੇਂ ਗੱਲ ਕਰੇ?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">ਛੋਟੀ ਅਤੇ ਸਿੱਧੀ</button>
        <button type="button" class="elicit-pill" data-value="Detailed">ਵਿਸਥਾਰ ਨਾਲ</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">ਦੋਸਤਾਨਾ ਅਤੇ ਖੁੱਲ੍ਹੀ</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">ਰਸਮੀ ਅਤੇ ਪ੍ਰੋਫ਼ੈਸ਼ਨਲ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>ਹੋਰ</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="ਸਿੱਧੀ ਗੱਲ, ਥੋੜ੍ਹੇ ਹਾਸੇ-ਮਜ਼ਾਕ ਨਾਲ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਤੁਸੀਂ ਕਿੱਥੇ ਰਹਿੰਦੇ ਹੋ? ਇਹ ਜ਼ਰੂਰੀ ਨਹੀਂ, ਇਸ ਨਾਲ ਤੁਹਾਡਾ ਟਾਈਮ ਜ਼ੋਨ ਸੈੱਟ ਹੁੰਦਾ ਹੈ।</label>
      <input type="text" data-name="city" placeholder="ਲੁਧਿਆਣਾ, ਪੰਜਾਬ">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ਕੋਈ ਲਿੰਕ ਹੈ ਜੋ ਤੁਹਾਡੇ ਬਾਰੇ ਦੱਸਦਾ ਹੋਵੇ? ਤੁਹਾਡਾ ਏਜੰਟ ਉਸਨੂੰ ਪੜ੍ਹ ਲਵੇਗਾ, ਤਾਂ ਜੋ ਤੁਹਾਨੂੰ ਘੱਟ ਲਿਖਣਾ ਪਵੇ।</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">ਛੱਡੋ</button>
    <button type="button" class="elicit-submit">ਅੱਗੇ ਚੱਲੋ</button>
  </div>
</form>
