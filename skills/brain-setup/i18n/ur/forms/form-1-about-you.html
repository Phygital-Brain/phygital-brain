<h2 class="sr-only">سیٹ اپ فارم 4 میں سے 1: آپ کے بارے میں۔</h2>
<form class="elicit" dir="rtl">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>برین کی تفصیل: آپ کے بارے میں (4 میں سے 1)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">آپ کا نام کیا ہے، اور آپ کا کام کیا ہے؟ ایک لائن میں۔</label>
      <input type="text" data-name="name" placeholder="عائشہ خان، بچوں کی کتابوں کی السٹریٹر">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ان میں سے کون سا آپ پر سب سے زیادہ پورا اترتا ہے؟</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">فری لانسر یا کری ایٹر</span><br><span style="font-size:11px; color:var(--text-muted)">اپنے لیے کام</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">چھوٹا کاروبار</span><br><span style="font-size:11px; color:var(--text-muted)">ایک فرد کی یا بہت چھوٹی کمپنی</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ملازمت یا پروفیشنل کام</span><br><span style="font-size:11px; color:var(--text-muted)">کسی کمپنی میں کام</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ذاتی پروجیکٹس</span><br><span style="font-size:11px; color:var(--text-muted)">پڑھائی، شوق، سائیڈ پروجیکٹس</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">کچھ اور</span><br><span style="font-size:11px; color:var(--text-muted)">اپنے الفاظ میں لکھیں</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="ٹیچر، اور ساتھ میں کورسز بیچنے کا کام" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">کیا آپ کی کوئی سروس، پروڈکٹ یا کلائنٹس ہیں؟</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">جی ہاں، سروسز یا کلائنٹس</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">جی ہاں، پروڈکٹس</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">ابھی نہیں، ارادہ ہے</button>
        <button type="button" class="elicit-pill" data-value="No">نہیں</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">سیکنڈ برین کن کاموں میں آپ کی مدد کرے؟</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">پروجیکٹس منظم کرنا</span><br><span style="font-size:11px; color:var(--text-muted)">پلان، اسٹیٹس، اگلے قدم</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">لوگوں کو یاد رکھنا</span><br><span style="font-size:11px; color:var(--text-muted)">کلائنٹس، ساتھی، رابطے</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">میرے لیے لکھنا</span><br><span style="font-size:11px; color:var(--text-muted)">میرے انداز میں ای میلز اور پوسٹس</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">اہداف اور فیصلے</span><br><span style="font-size:11px; color:var(--text-muted)">میرا ہدف کیا ہے اور کیوں</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">کچھ اور</span><br><span style="font-size:11px; color:var(--text-muted)">اپنے الفاظ میں لکھیں</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="اپنے مطالعے کا حساب رکھنا" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">آپ کی خوبیاں کیا ہیں؟ ہنر، مضبوط پہلو، اور لوگ کس کام کے لیے آپ کے پاس آتے ہیں۔</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="جانوروں کی ڈرائنگ، بات کو آسانی سے سمجھانا، ڈیڈ لائن کے دباؤ میں تیزی سے کام"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">آپ کے اصول کیا ہیں، اور کون سا کام آپ کو منظور نہیں؟</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="ایمان داری کا کام، مناسب معاوضہ۔ جوئے یا تمباکو والے کلائنٹس نہیں۔"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">کوئی بات آپ کو کس طرح سب سے اچھی سمجھ آتی ہے؟</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">مختصر فہرستیں</button>
        <button type="button" class="elicit-pill" data-value="Examples">مثالیں</button>
        <button type="button" class="elicit-pill" data-value="Step by step">قدم بہ قدم</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">تصویریں اور خاکے</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>کچھ اور</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="وائس نوٹس جو میں سن سکوں" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">آپ کی توجہ کس وقت سب سے زیادہ ہوتی ہے؟</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">صبح سویرے</button>
        <button type="button" class="elicit-pill" data-value="Late morning">دوپہر سے پہلے</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">دوپہر کے بعد</button>
        <button type="button" class="elicit-pill" data-value="Night">رات</button>
        <button type="button" class="elicit-pill" data-value="It changes">بدلتا رہتا ہے</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="آپ کو کیا چیز تھکا دیتی ہے؟ لمبی کالز، بہت زیادہ میسجز، جمعے کو دفتری کام"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">آپ کا ایجنٹ آپ سے کیسے بات کرے؟</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">مختصر اور سیدھی بات</button>
        <button type="button" class="elicit-pill" data-value="Detailed">تفصیل سے</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">دوستانہ اور بے تکلف</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">رسمی اور پروفیشنل</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>کچھ اور</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="سیدھی بات، تھوڑے مزاح کے ساتھ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">آپ کا شہر کون سا ہے؟ اختیاری ہے، اس سے آپ کا ٹائم زون طے ہوتا ہے۔</label>
      <input type="text" data-name="city" placeholder="لاہور، پاکستان">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">کوئی لنک ہے جس میں آپ کا تعارف ہو؟ آپ کا ایجنٹ اسے پڑھ لے گا، تاکہ آپ کو کم لکھنا پڑے۔</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">چھوڑیں</button>
    <button type="button" class="elicit-submit">آگے بڑھیں</button>
  </div>
</form>
