<h2 class="sr-only">טופס הגדרה 3 מתוך 4: הימים והאנשים שלך.</h2>
<form class="elicit" dir="rtl">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>פרטים למוח: הימים והאנשים שלך (3 מתוך 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">מהם ימי העבודה שלך?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">ב׳</button>
        <button type="button" class="elicit-pill" data-value="Tue">ג׳</button>
        <button type="button" class="elicit-pill" data-value="Wed">ד׳</button>
        <button type="button" class="elicit-pill" data-value="Thu">ה׳</button>
        <button type="button" class="elicit-pill" data-value="Fri">ו׳</button>
        <button type="button" class="elicit-pill" data-value="Sat">ש׳</button>
        <button type="button" class="elicit-pill" data-value="Sun">א׳</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">מתי תדריך הבוקר שלך יהיה מוכן?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">בלי תדריך</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>אחר</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">מי האנשים הכי חשובים בעבודה שלך כרגע? עד 3 שמות, שורה לכל אחד.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="מיכל, העורכת שלי בהוצאה&#10;יואב, שותף בסטודיו&#10;ליאת, הסוכנת הספרותית שלי"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">עם מי יוצא לך לעבוד?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">לקוחות</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">משתפי פעולה</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">צוות או פרילנסרים</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">שותפים, תקשורת או מקומות אירוח</button>
        <button type="button" class="elicit-pill" data-value="Just me">רק אני</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>אחר</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="תלמידים" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">הרשתות החברתיות שלך, לעבודה או לפרויקטים אישיים.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/noa.draws (עבודה)&#10;linkedin.com/in/noacohen&#10;tiktok.com/@noasketchbook (אישי)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">באילו ערוצים יש לך קשר עם אנשים?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail או Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook או Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack או Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>אחר</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">איפה נמצאים היום הפתקים והעבודה שלך?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive או Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva או Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">גיליונות אלקטרוניים</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">מחברות נייר</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>אחר</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">איך הכתיבה שלך צריכה להישמע?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">חם ואישי</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">ישיר ובטוח</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">צנוע וכן</button>
        <button type="button" class="elicit-pill" data-value="Playful">קליל ושובב</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>אחר</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="כמו בשיחה עם חבר" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">דילוג</button>
    <button type="button" class="elicit-submit">המשך</button>
  </div>
</form>
