    <span>Je brein: je dagen en je mensen (3 van 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Op welke dagen werk je?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">ma</button>
        <button type="button" class="elicit-pill" data-value="Tue">di</button>
        <button type="button" class="elicit-pill" data-value="Wed">wo</button>
        <button type="button" class="elicit-pill" data-value="Thu">do</button>
        <button type="button" class="elicit-pill" data-value="Fri">vr</button>
        <button type="button" class="elicit-pill" data-value="Sat">za</button>
        <button type="button" class="elicit-pill" data-value="Sun">zo</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Hoe laat moet je ochtendoverzicht klaarstaan?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Geen overzicht</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iets anders</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Wie zijn nu het belangrijkst in je werk? Hooguit 3 namen, één per regel.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, mijn redacteur bij de uitgeverij&#10;João, partner in de studio&#10;Lia, mijn literair agent"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Met wie werk je samen?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Klanten</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Samenwerkingspartners</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Team of freelancers</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partners, pers of locaties</button>
        <button type="button" class="elicit-pill" data-value="Just me">Alleen ik</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iets anders</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Studenten" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Zet hier je social media, voor je werk of voor persoonlijke projecten.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (werk)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (privé)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Waar praat je met mensen?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail of Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook of Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack of Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iets anders</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Waar staan je notities en je werk nu?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive of Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva of Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Spreadsheets</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Notitieboekjes op papier</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iets anders</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Hoe wil je overkomen als je schrijft?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Warm en persoonlijk</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Direct en zelfverzekerd</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Bescheiden en eerlijk</button>
        <button type="button" class="elicit-pill" data-value="Playful">Speels</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iets anders</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Zoals ik met een vriend praat" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Overslaan</button>
    <button type="button" class="elicit-submit">Verder</button>
  </div>
</form>
