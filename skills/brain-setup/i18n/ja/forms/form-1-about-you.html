<h2 class="sr-only">セットアップ 1/4：あなたについて</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>ブレインの設定：あなたについて（1/4）</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">お名前と、どんなことをしているかを一言で教えてください。</label>
      <input type="text" data-name="name" placeholder="佐藤花、絵本のイラストレーター">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">いちばん近いのはどれですか？</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">フリーランス・クリエイター</span><br><span style="font-size:11px; color:var(--text-muted)">個人で仕事をしている</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">小さな会社の経営者</span><br><span style="font-size:11px; color:var(--text-muted)">ひとり会社や少人数の会社</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">会社員・専門職</span><br><span style="font-size:11px; color:var(--text-muted)">会社に勤めている</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">個人の活動</span><br><span style="font-size:11px; color:var(--text-muted)">勉強、趣味、副業</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">その他</span><br><span style="font-size:11px; color:var(--text-muted)">自分の言葉で書いてください</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="教師、副業でオンライン講座を販売" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">何かを販売していますか？クライアントはいますか？</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">はい、サービスやクライアントがある</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">はい、商品を売っている</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">まだだけど、予定している</button>
        <button type="button" class="elicit-pill" data-value="No">いいえ</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">セカンドブレインに何を手伝ってほしいですか？</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">プロジェクトの整理</span><br><span style="font-size:11px; color:var(--text-muted)">計画、進み具合、次にやること</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">人のことを覚えておく</span><br><span style="font-size:11px; color:var(--text-muted)">クライアント、協力者、連絡先</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">文章を書いてもらう</span><br><span style="font-size:11px; color:var(--text-muted)">自分らしい言葉でメールや投稿を</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">目標と決めごと</span><br><span style="font-size:11px; color:var(--text-muted)">目指していることと、その理由</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">その他</span><br><span style="font-size:11px; color:var(--text-muted)">自分の言葉で書いてください</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="読んだ本の記録" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">得意なことは何ですか？スキル、強み、よく頼まれることなど。</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="動物の絵、むずかしいことをやさしく説明すること、締め切り前のスピード"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">大切にしていることは何ですか？受けない仕事はありますか？</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="誠実な仕事と適正な報酬。ギャンブルやたばこ関係の仕事は受けません。"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">どんな形だといちばん頭に入りますか？</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">短い箇条書き</button>
        <button type="button" class="elicit-pill" data-value="Examples">具体例</button>
        <button type="button" class="elicit-pill" data-value="Step by step">一歩ずつ</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">絵や図</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>その他</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="聞ける音声メモ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">いちばん集中できるのはいつですか？</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">早朝</button>
        <button type="button" class="elicit-pill" data-value="Late morning">午前中</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">午後</button>
        <button type="button" class="elicit-pill" data-value="Night">夜</button>
        <button type="button" class="elicit-pill" data-value="It changes">日によって違う</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="疲れることは？長い電話、多すぎるメッセージ、金曜日の事務作業など"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">エージェントにはどんな話し方をしてほしいですか？</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">短く、わかりやすく</button>
        <button type="button" class="elicit-pill" data-value="Detailed">くわしく</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">親しみやすく、気軽に</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">ていねいに、きちんと</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>その他</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="はっきりと、少しユーモアを交えて" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">どこに住んでいますか？（任意。タイムゾーンの設定に使います）</label>
      <input type="text" data-name="city" placeholder="東京都">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">あなたのことがわかるリンクはありますか？エージェントが読むので、入力が少なくて済みます。</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">スキップ</button>
    <button type="button" class="elicit-submit">次へ</button>
  </div>
</form>
