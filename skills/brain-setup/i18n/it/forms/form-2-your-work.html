        <button type="button" class="elicit-pill" data-value="Individuals">Privati</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Altri creator</button>

      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Scuole" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Come ti trova la maggior parte dei clienti?</label>

        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Fiere del libro" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Cosa ti rallenta di più?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Trovare clienti</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Burocrazia, preventivi e fatture</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Pubblicare contenuti con costanza</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Troppi strumenti e appunti sparsi</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Oppure dillo con parole tue"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual è il tuo obiettivo principale per i prossimi 12 mesi?</label>

        <button type="button" class="elicit-pill" data-value="More free time">Più tempo libero</button>

        <button type="button" class="elicit-pill" data-value="Get organised">Organizzarmi meglio</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Oppure dillo con parole tue: firmare il mio primo contratto con un editore"></textarea>
    </div>

    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Quali ambiti contano di più adesso?</label>

        <button type="button" class="elicit-pill" data-value="Career or job">Carriera o lavoro</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Formazione o studio</button>

        <button type="button" class="elicit-pill" data-value="Side project">Progetto parallelo</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Salute e sport" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Cosa ti rallenta di più?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Troppe idee, poche portate a termine</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Appunti sparsi</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Dimenticare dettagli sulle persone</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">Nessun obiettivo chiaro</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Oppure dillo con parole tue"></textarea>

    <div class="elicit-group">
      <label class="elicit-question">Qual è il tuo obiettivo principale per i prossimi 12 mesi?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Crescere nel lavoro</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Finire un progetto importante</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Imparare qualcosa di nuovo</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Organizzarmi meglio</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Oppure dillo con parole tue: finire il mio primo cortometraggio"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Su cosa stai lavorando adesso? Fino a 3, uno per riga.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Nuovo albo illustrato per un editore&#10;Sito portfolio&#10;Mettere da parte i soldi per uno studio"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Cosa ti preoccupa di più in questo momento?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Due consegne nella stessa settimana e niente tempo per cercare nuovi lavori"></textarea>
    </div>
  </div>

    <button type="button" class="elicit-skip">Salta</button>
