<h2 class="sr-only">Modulo di configurazione 3 di 4: le tue giornate e le tue persone.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Il tuo cervello: giornate e persone (3 di 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">In quali giorni lavori?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Lun</button>
        <button type="button" class="elicit-pill" data-value="Tue">Mar</button>
        <button type="button" class="elicit-pill" data-value="Wed">Mer</button>
        <button type="button" class="elicit-pill" data-value="Thu">Gio</button>
        <button type="button" class="elicit-pill" data-value="Fri">Ven</button>
        <button type="button" class="elicit-pill" data-value="Sat">Sab</button>
        <button type="button" class="elicit-pill" data-value="Sun">Dom</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">A che ora vuoi il tuo punto del mattino?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Non mi serve</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Chi conta di più nel tuo lavoro adesso? Fino a 3 nomi, uno per riga.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, la mia editor alla casa editrice&#10;Luca, socio dello studio&#10;Lia, la mia agente"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Con chi lavori?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Clienti</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Collaboratori</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Team o freelance</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partner, stampa o locali</button>
        <button type="button" class="elicit-pill" data-value="Just me">Solo io</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Studenti" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Elenca i tuoi profili social, per lavoro o per progetti personali.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (lavoro)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (personale)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Dove parli con le persone?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail o Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook o Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack o Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Dove tieni oggi i tuoi appunti e il tuo lavoro?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive o Documenti Google</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Note di Apple</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva o Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Fogli di calcolo</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Quaderni di carta</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Che tono vuoi avere quando scrivi?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Caldo e personale</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Diretto e sicuro</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Umile e sincero</button>
        <button type="button" class="elicit-pill" data-value="Playful">Giocoso</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altro</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Come parlo con gli amici" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Salta</button>
    <button type="button" class="elicit-submit">Continua</button>
  </div>
</form>
