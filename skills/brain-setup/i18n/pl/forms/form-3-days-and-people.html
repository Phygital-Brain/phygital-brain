<h2 class="sr-only">Formularz konfiguracji 3 z 4: twoje dni i ludzie.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Twój drugi mózg: twoje dni i ludzie (3 z 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">W które dni pracujesz?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Pn</button>
        <button type="button" class="elicit-pill" data-value="Tue">Wt</button>
        <button type="button" class="elicit-pill" data-value="Wed">Śr</button>
        <button type="button" class="elicit-pill" data-value="Thu">Cz</button>
        <button type="button" class="elicit-pill" data-value="Fri">Pt</button>
        <button type="button" class="elicit-pill" data-value="Sat">Sb</button>
        <button type="button" class="elicit-pill" data-value="Sun">Nd</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Na którą ma być gotowe twoje poranne podsumowanie?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Bez podsumowania</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Inne</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Kto jest teraz najważniejszy w twojej pracy? Maksymalnie 3 osoby, każda w osobnej linii.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, moja redaktorka w wydawnictwie&#10;Tomek, wspólnik w pracowni&#10;Ola, moja agentka"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Z kim pracujesz?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Klienci</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Współtwórcy</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Zespół albo freelancerzy</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partnerzy, media albo miejsca wydarzeń</button>
        <button type="button" class="elicit-pill" data-value="Just me">Tylko ja</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Inne</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Uczniowie" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Wypisz swoje media społecznościowe, do pracy albo projektów osobistych.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/anna.rysuje (praca)&#10;linkedin.com/in/annanowak&#10;tiktok.com/@szkicownikanny (prywatnie)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Gdzie rozmawiasz z ludźmi?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail albo Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook albo Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack albo Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Inne</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Gdzie dziś trzymasz notatki i pracę?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Dysk Google albo Dokumenty</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Notatki Apple</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva albo Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Arkusze kalkulacyjne</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Papierowe notesy</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Inne</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Jak chcesz brzmieć, kiedy piszesz?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Ciepło i osobiście</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Wprost i pewnie</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Skromnie i szczerze</button>
        <button type="button" class="elicit-pill" data-value="Playful">Z humorem</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Inne</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Tak jak do znajomych" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Pomiń</button>
    <button type="button" class="elicit-submit">Dalej</button>
  </div>
</form>
