    <div class="elicit-group">

    </div>

      <label class="elicit-question">Jakie wartości są dla ciebie ważne i jakiej pracy nie bierzesz?</label>

    <div class="elicit-group">
      <label class="elicit-question">Kiedy najlepiej się skupiasz?</label>

        <button type="button" class="elicit-pill" data-value="Late morning">Przed południem</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Po południu</button>
        <button type="button" class="elicit-pill" data-value="Night">W nocy</button>
        <button type="button" class="elicit-pill" data-value="It changes">Różnie</button>

      <textarea class="elicit-textarea" data-name="energy" placeholder="Co cię męczy? Długie rozmowy, za dużo wiadomości, papierologia w piątki"></textarea>

    <div class="elicit-group">
      <label class="elicit-question">Jak ma do ciebie mówić twój agent?</label>

        <button type="button" class="elicit-pill" data-value="Detailed">Szczegółowo</button>

    <div class="elicit-group">
      <label class="elicit-question">Masz link, który cię opisuje? Twój agent go przeczyta, więc będzie mniej pisania.</label>
      <input type="text" data-name="link" placeholder="https://twojastrona.pl">
