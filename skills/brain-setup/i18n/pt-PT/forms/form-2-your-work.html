  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Dados do cérebro: o teu trabalho (2 de 4)</span>
  </div>
  <div class="elicit-body">
    <!-- JOB QUESTIONS: replace this whole block, down to END JOB QUESTIONS, with 3 questions written for the person's own work (see SKILL.md, Form 2). Example for an illustrator:
    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Per project">Per project</button>
        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>
    END JOB QUESTIONS -->
    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Quem são os teus clientes?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">Empresas e marcas</button>
        <button type="button" class="elicit-pill" data-value="Agencies">Agências</button>
        <button type="button" class="elicit-pill" data-value="Individuals">Particulares</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Outros criadores de conteúdos</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Outro</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Escolas" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Como é que a maioria dos clientes chega até ti?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">Recomendações e passa-palavra</button>
        <button type="button" class="elicit-pill" data-value="Social media">Redes sociais</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">Sou eu que os contacto</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">Plataformas ou marketplaces</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Outro</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Feiras do livro" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">O que te atrasa mais?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Arranjar clientes</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Papelada, orçamentos e faturas</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Publicar conteúdos com regularidade</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Ferramentas a mais e notas espalhadas</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Ou diz por palavras tuas"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é o teu principal objetivo para os próximos 12 meses?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Ganhar mais</button>
        <button type="button" class="elicit-pill" data-value="More free time">Ter mais tempo livre</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Lançar algo novo</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Organizar-me</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Ou diz por palavras tuas: assinar o contrato do meu primeiro livro"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Que áreas são mais importantes neste momento?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Carreira ou emprego</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Aprender ou estudar</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Projetos criativos</button>
        <button type="button" class="elicit-pill" data-value="Side project">Projeto paralelo</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Outro</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Saúde e desporto" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">O que te atrasa mais?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Ideias a mais, pouca concretização</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Notas espalhadas</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Esquecer pormenores sobre as pessoas</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">Falta de objetivos claros</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Ou diz por palavras tuas"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é o teu principal objetivo para os próximos 12 meses?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Crescer na carreira</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Acabar um projeto grande</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Aprender uma coisa nova</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Organizar-me</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Ou diz por palavras tuas: acabar a minha primeira curta-metragem"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">Em que estás a trabalhar agora? Até 3, um por linha.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Novo livro ilustrado para uma editora&#10;Site do portefólio&#10;Poupar para ter um estúdio"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">O que te preocupa mais neste momento?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Dois prazos na mesma semana e nenhum tempo para procurar trabalho novo"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Saltar</button>
    <button type="button" class="elicit-submit">Continuar</button>
  </div>
</form>
