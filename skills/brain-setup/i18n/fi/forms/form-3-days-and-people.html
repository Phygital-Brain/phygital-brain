<h2 class="sr-only">Käyttöönotto, lomake 3/4: päiväsi ja ihmiset.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Aivojesi tiedot: päiväsi ja ihmiset (3/4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Minä päivinä teet töitä?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Ma</button>
        <button type="button" class="elicit-pill" data-value="Tue">Ti</button>
        <button type="button" class="elicit-pill" data-value="Wed">Ke</button>
        <button type="button" class="elicit-pill" data-value="Thu">To</button>
        <button type="button" class="elicit-pill" data-value="Fri">Pe</button>
        <button type="button" class="elicit-pill" data-value="Sat">La</button>
        <button type="button" class="elicit-pill" data-value="Sun">Su</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Milloin aamukatsauksesi pitäisi olla valmis?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Ei katsausta</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Muu</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10.30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Ketkä ovat työssäsi nyt tärkeimpiä? Enintään 3 nimeä, kukin omalle rivilleen.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, kustannustoimittajani&#10;João, studiokumppani&#10;Lia, kirjallisuusagenttini"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Kenen kanssa teet töitä?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Asiakkaat</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Yhteistyökumppanit</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Tiimi tai freelancerit</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Kumppanit, media tai tapahtumapaikat</button>
        <button type="button" class="elicit-pill" data-value="Just me">Vain minä</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Muu</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Opiskelijat" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Listaa sometilisi, sekä työhön että omiin projekteihin liittyvät.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (työ)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (oma)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Missä pidät yhteyttä ihmisiin?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail tai Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook tai Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack tai Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Muu</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Missä muistiinpanosi ja työsi ovat nyt?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive tai Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva tai Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Taulukot</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Paperiset muistikirjat</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Muu</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Miltä haluat kuulostaa kirjoittaessasi?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Lämpimältä ja henkilökohtaiselta</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Suoralta ja itsevarmalta</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Nöyrältä ja rehelliseltä</button>
        <button type="button" class="elicit-pill" data-value="Playful">Leikkisältä</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Muu</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Siltä kuin puhuisin kaverille" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Ohita</button>
    <button type="button" class="elicit-submit">Jatka</button>
  </div>
</form>
