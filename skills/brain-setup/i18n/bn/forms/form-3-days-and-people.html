  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">কোন কোন দিন কাজ করেন?</label>

        <button type="button" class="elicit-pill" data-value="Sun">রবি</button>
      </div>
    </div>

      <label class="elicit-question">আপনার সকালের ব্রিফিং কখন তৈরি থাকবে?</label>

        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>

      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">এই মুহূর্তে আপনার কাজে সবচেয়ে গুরুত্বপূর্ণ কারা? সর্বোচ্চ 3টি নাম, প্রতিটি আলাদা লাইনে।</label>

    <div class="elicit-group">
      <label class="elicit-question">কাদের সঙ্গে কাজ করেন?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">ক্লায়েন্ট</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">সহযোগী</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">টিম বা ফ্রিল্যান্সার</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">পার্টনার, সংবাদমাধ্যম বা ভেন্যু</button>

        <button type="button" class="elicit-pill" data-value="Other" data-other>অন্য কিছু</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="ছাত্রছাত্রী" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">আপনার সোশ্যাল মিডিয়াগুলো লিখুন, কাজের হোক বা নিজের প্রজেক্টের।</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ananya.draws (কাজের)&#10;linkedin.com/in/ananyaroy&#10;youtube.com/@ananyasketchbook (নিজের)"></textarea>
    </div>
    <div class="elicit-group">

        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail বা Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook বা Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack বা Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>অন্য কিছু</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">

        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva বা Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">স্প্রেডশিট</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">কাগজের খাতা</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>অন্য কিছু</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>

      <label class="elicit-question">লেখায় আপনি কেমন শোনাতে চান?</label>

        <button type="button" class="elicit-pill" data-value="Playful">মজার, হাসিখুশি</button>

    </div>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">বাদ দিন</button>
    <button type="button" class="elicit-submit">এগিয়ে যান</button>
  </div>
</form>
