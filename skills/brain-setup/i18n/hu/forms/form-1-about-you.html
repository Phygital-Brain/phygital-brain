  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Hogy hívnak, és mivel foglalkozol, egy mondatban?</label>
      <input type="text" data-name="name" placeholder="Ana Costa, gyerekkönyv-illusztrátor">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Mi illik rád a legjobban?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Szabadúszó vagy alkotó</span><br><span style="font-size:11px; color:var(--text-muted)">Saját magadnak dolgozol</span></span></button>

        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Saját projektek</span><br><span style="font-size:11px; color:var(--text-muted)">Tanulás, hobbik, mellékprojektek</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Más</span><br><span style="font-size:11px; color:var(--text-muted)">Írd le a saját szavaiddal</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Tanár, aki mellékesen kurzusokat is árul" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Árulsz valamit, vagy vannak ügyfeleid?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Igen, szolgáltatások vagy ügyfelek</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Igen, termékek</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Még nem, de tervezem</button>
        <button type="button" class="elicit-pill" data-value="No">Nem</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Miben segítsen a második agyad?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Projektek rendben tartása</span><br><span style="font-size:11px; color:var(--text-muted)">Tervek, hol tartok, következő lépések</span></span></button>

        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Írjon helyettem</span><br><span style="font-size:11px; color:var(--text-muted)">E-mailek és posztok az én stílusomban</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Célok és döntések</span><br><span style="font-size:11px; color:var(--text-muted)">Mit szeretnék elérni, és miért</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Más</span><br><span style="font-size:11px; color:var(--text-muted)">Írd le a saját szavaiddal</span></span></button>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">Miben vagy jó? Készségek, erősségek, amiért az emberek hozzád fordulnak.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Állatokat rajzolni, egyszerűen elmagyarázni dolgokat, gyorsan dolgozni, ha szorít a határidő"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Mi fontos neked, és milyen munkára mondasz nemet?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Becsületes munka, tisztességes fizetés. Szerencsejáték- és dohánycégeknek nem dolgozom."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hogyan érted meg a legkönnyebben a dolgokat?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Rövid listák</button>
        <button type="button" class="elicit-pill" data-value="Examples">Példák</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Lépésről lépésre</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Képek és ábrák</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Hangüzenetek, amiket meghallgathatok" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Mikor tudsz a legjobban koncentrálni?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Kora reggel</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Délelőtt</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Délután</button>
        <button type="button" class="elicit-pill" data-value="Night">Késő este</button>
        <button type="button" class="elicit-pill" data-value="It changes">Változó</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Mi szív le? Hosszú hívások, túl sok üzenet, papírmunka pénteken"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hogyan beszéljen veled az ügynököd?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Röviden és egyszerűen</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Részletesen</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Barátságosan, lazán</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Hivatalosan, szakmaian</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Egyenesen, egy kis humorral" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hol élsz? Nem kötelező, ebből állítjuk be az időzónádat.</label>
      <input type="text" data-name="city" placeholder="Budapest, Magyarország">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Van egy linked, ami bemutat? Az ügynököd elolvassa, így kevesebbet kell gépelned.</label>
      <input type="text" data-name="link" placeholder="https://azoldalad.hu">
    </div>

  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Kihagyom</button>
    <button type="button" class="elicit-submit">Tovább</button>
  </div>
