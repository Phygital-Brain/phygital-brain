<h2 class="sr-only">Beállítás, 3. űrlap (4-ből): a napjaid és az embereid.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Az agyad adatai: a napjaid és az embereid (3/4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Melyik napokon dolgozol?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">H</button>
        <button type="button" class="elicit-pill" data-value="Tue">K</button>
        <button type="button" class="elicit-pill" data-value="Wed">Sze</button>
        <button type="button" class="elicit-pill" data-value="Thu">Cs</button>
        <button type="button" class="elicit-pill" data-value="Fri">P</button>
        <button type="button" class="elicit-pill" data-value="Sat">Szo</button>
        <button type="button" class="elicit-pill" data-value="Sun">V</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Mikorra legyen kész a reggeli összefoglalód?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Nem kérek összefoglalót</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Kik a legfontosabbak most a munkádban? Legfeljebb 3 név, mindegyik külön sorban.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, a szerkesztőm a kiadónál&#10;João, társ a műteremben&#10;Lia, az irodalmi ügynököm"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Kikkel dolgozol?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Ügyfelek</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Alkotótársak</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Csapat vagy szabadúszók</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partnerek, sajtó vagy helyszínek</button>
        <button type="button" class="elicit-pill" data-value="Just me">Csak én</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Diákok" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Sorold fel a közösségimédia-fiókjaidat, akár munkához, akár saját projektekhez.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (munka)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (magán)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hol beszélsz az emberekkel?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail vagy Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook vagy Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack vagy Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hol vannak most a jegyzeteid és a munkáid?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive vagy Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Jegyzetek</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva vagy Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Táblázatok</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Papírfüzetek</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Milyen legyen a stílusod írásban?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Kedves és személyes</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Egyenes és magabiztos</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Szerény és őszinte</button>
        <button type="button" class="elicit-pill" data-value="Playful">Játékos</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Más</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Ahogy egy barátommal beszélek" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Kihagyom</button>
    <button type="button" class="elicit-submit">Tovább</button>
  </div>
</form>
