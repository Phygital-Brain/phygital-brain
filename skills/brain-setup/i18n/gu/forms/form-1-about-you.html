<h2 class="sr-only">સેટઅપ ફોર્મ 4માંથી 1: તમારા વિશે.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>બ્રેનની વિગતો: તમારા વિશે (4માંથી 1)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">તમારું નામ શું છે, અને તમે શું કરો છો? એક લાઇનમાં લખો.</label>
      <input type="text" data-name="name" placeholder="અંજલિ મહેતા, બાળકોનાં પુસ્તકો માટે ચિત્રો બનાવું છું">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમને સૌથી વધુ શું લાગુ પડે છે?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ફ્રીલાન્સર કે ક્રિએટર</span><br><span style="font-size:11px; color:var(--text-muted)">પોતાના માટે કામ કરે છે</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">નાના બિઝનેસના માલિક</span><br><span style="font-size:11px; color:var(--text-muted)">એક વ્યક્તિની કે નાનકડી કંપની</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">નોકરિયાત કે પ્રોફેશનલ</span><br><span style="font-size:11px; color:var(--text-muted)">કોઈ કંપનીમાં કામ કરે છે</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">અંગત પ્રોજેક્ટ</span><br><span style="font-size:11px; color:var(--text-muted)">અભ્યાસ, શોખ, સાઇડ પ્રોજેક્ટ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">બીજું</span><br><span style="font-size:11px; color:var(--text-muted)">તમારા શબ્દોમાં લખો</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="શિક્ષક, સાથે સાથે કોર્સ પણ વેચું છું" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમે કંઈ વેચો છો, કે તમારા ક્લાયન્ટ છે?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">હા, સેવાઓ કે ક્લાયન્ટ</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">હા, પ્રોડક્ટ</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">હજી નહીં, પણ વિચાર છે</button>
        <button type="button" class="elicit-pill" data-value="No">ના</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમારું સેકન્ડ બ્રેન શેમાં મદદ કરે?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">પ્રોજેક્ટ ગોઠવવા</span><br><span style="font-size:11px; color:var(--text-muted)">પ્લાન, સ્થિતિ, આગળનાં પગલાં</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">લોકોને યાદ રાખવા</span><br><span style="font-size:11px; color:var(--text-muted)">ક્લાયન્ટ, સહયોગીઓ, સંપર્કો</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">મારા માટે લખવું</span><br><span style="font-size:11px; color:var(--text-muted)">મારી શૈલીમાં ઈમેલ અને પોસ્ટ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ધ્યેય અને નિર્ણયો</span><br><span style="font-size:11px; color:var(--text-muted)">મારે શું મેળવવું છે અને કેમ</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">બીજું</span><br><span style="font-size:11px; color:var(--text-muted)">તમારા શબ્દોમાં લખો</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="હું શું વાંચું છું તેનો હિસાબ રાખવો" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમને શું સારું આવડે છે? આવડત, ખૂબીઓ, લોકો તમારી પાસે શેના માટે આવે છે.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="પ્રાણીઓનાં ચિત્રો, વાત સહેલાઈથી સમજાવવી, ડેડલાઇનમાં ઝડપથી કામ કરવું"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમે કઈ વાતમાં માનો છો, અને કયા કામને ના પાડો છો?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="પ્રામાણિક કામ, વાજબી વળતર. જુગાર કે તમાકુવાળા ક્લાયન્ટ નહીં."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમને કઈ રીતે વાત સૌથી સહેલાઈથી સમજાય છે?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">ટૂંકી યાદીઓ</button>
        <button type="button" class="elicit-pill" data-value="Examples">ઉદાહરણો</button>
        <button type="button" class="elicit-pill" data-value="Step by step">એક એક પગલું</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">ચિત્રો અને આકૃતિઓ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>બીજું</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="સાંભળી શકું એવી વોઇસ નોટ્સ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમારું મન કામમાં ક્યારે સૌથી વધુ લાગે છે?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">વહેલી સવારે</button>
        <button type="button" class="elicit-pill" data-value="Late morning">મોડી સવારે</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">બપોરે</button>
        <button type="button" class="elicit-pill" data-value="Night">રાત્રે</button>
        <button type="button" class="elicit-pill" data-value="It changes">બદલાતું રહે છે</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="તમને શું થકવી દે છે? લાંબા કૉલ, બહુ બધા મેસેજ, શુક્રવારે કાગળકામ"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમારો એજન્ટ તમારી સાથે કેવી રીતે વાત કરે?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">ટૂંકું અને સીધું</button>
        <button type="button" class="elicit-pill" data-value="Detailed">વિગતવાર</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">મૈત્રીભર્યું અને હળવું</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">ઔપચારિક અને પ્રોફેશનલ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>બીજું</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="સીધું, થોડી રમૂજ સાથે" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમે ક્યાં રહો છો? ભરવું ફરજિયાત નથી, આનાથી તમારો ટાઇમ ઝોન નક્કી થાય છે.</label>
      <input type="text" data-name="city" placeholder="અમદાવાદ, ભારત">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">તમારા વિશે કોઈ લિંક છે? તમારો એજન્ટ તે વાંચી લેશે, એટલે તમારે ઓછું લખવું પડશે.</label>
      <input type="text" data-name="link" placeholder="https://tamarisite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">છોડી દો</button>
    <button type="button" class="elicit-submit">આગળ વધો</button>
  </div>
</form>
