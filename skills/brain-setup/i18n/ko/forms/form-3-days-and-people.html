<h2 class="sr-only">설정 양식 3/4: 내 하루와 사람들.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>브레인 정보: 내 하루와 사람들 (3/4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">무슨 요일에 일해요?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">월</button>
        <button type="button" class="elicit-pill" data-value="Tue">화</button>
        <button type="button" class="elicit-pill" data-value="Wed">수</button>
        <button type="button" class="elicit-pill" data-value="Thu">목</button>
        <button type="button" class="elicit-pill" data-value="Fri">금</button>
        <button type="button" class="elicit-pill" data-value="Sat">토</button>
        <button type="button" class="elicit-pill" data-value="Sun">일</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">아침 브리핑은 몇 시에 준비되면 좋을까요?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">브리핑 없음</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>기타</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">지금 일에서 가장 중요한 사람은 누구예요? 최대 3명, 한 줄에 한 명씩 적어 주세요.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="수진, 출판사 담당 편집자&#10;준호, 작업실 파트너&#10;지아, 내 매니저"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">누구와 함께 일해요?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">클라이언트</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">협업자</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">팀원이나 프리랜서</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">파트너, 언론, 행사장</button>
        <button type="button" class="elicit-pill" data-value="Just me">나 혼자</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>기타</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="학생" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">SNS 계정을 적어 주세요. 일 계정이든 개인 프로젝트 계정이든 괜찮아요.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/haeun.draws (일)&#10;linkedin.com/in/haeunkim&#10;tiktok.com/@haeunsketch (개인)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">사람들과 주로 어디에서 연락해요?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail 또는 Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook 또는 Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack 또는 Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>기타</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">지금 메모와 작업물은 어디에 있어요?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive 또는 Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple 메모</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva 또는 Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">스프레드시트</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">종이 노트</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>기타</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">글에서 어떤 느낌을 주고 싶어요?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">따뜻하고 다정하게</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">솔직하고 자신 있게</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">겸손하고 진솔하게</button>
        <button type="button" class="elicit-pill" data-value="Playful">재치 있게</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>기타</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="친구한테 말하듯이" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">건너뛰기</button>
    <button type="button" class="elicit-submit">계속</button>
  </div>
</form>
