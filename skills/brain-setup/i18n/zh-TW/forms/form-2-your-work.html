    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>

      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">

        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>

      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>

    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">你的客戶是誰？</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">企業和品牌</button>
        <button type="button" class="elicit-pill" data-value="Agencies">廣告公司或代理商</button>
        <button type="button" class="elicit-pill" data-value="Individuals">個人</button>
        <button type="button" class="elicit-pill" data-value="Other creators">其他創作者</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="學校" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">大部分客戶是怎麼找到你的？</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">朋友介紹和口碑</button>
        <button type="button" class="elicit-pill" data-value="Social media">社群媒體</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">我主動聯絡他們</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">接案平台或電商平台</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="書展" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">什麼最拖慢你的進度？</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">找客戶</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">行政、報價和請款</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">固定發文</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">工具太多，筆記到處都是</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="或用你自己的話說"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">接下來 12 個月，你最主要的目標是什麼？</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">賺更多錢</button>
        <button type="button" class="elicit-pill" data-value="More free time">多一點自己的時間</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">推出新東西</button>
        <button type="button" class="elicit-pill" data-value="Get organised">變得更有條理</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="或用你自己的話說：簽下第一本書的出版合約"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">現在哪些方面對你最重要？</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">職涯或工作</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">學習或讀書</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">創作專案</button>
        <button type="button" class="elicit-pill" data-value="Side project">斜槓專案</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>其他</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="健康和運動" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">什麼最拖慢你的進度？</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">點子很多，但都沒做下去</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">筆記到處都是</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">常忘記跟人有關的細節</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">沒有明確的目標</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="或用你自己的話說"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">接下來 12 個月，你最主要的目標是什麼？</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">在職涯上更進一步</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">完成一個大專案</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">學一個新技能</button>
        <button type="button" class="elicit-pill" data-value="Get organised">變得更有條理</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="或用你自己的話說：拍完我的第一部短片"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">你現在在忙什麼？最多 3 個，一行一個。</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="幫出版社畫新繪本&#10;作品集網站&#10;存錢開工作室"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">現在最讓你煩惱的是什麼？</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="同一週有兩個截稿日，完全沒時間找新案子"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">跳過</button>
    <button type="button" class="elicit-submit">繼續</button>
  </div>
</form>
