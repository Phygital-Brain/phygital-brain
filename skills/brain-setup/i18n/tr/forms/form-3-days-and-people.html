<h2 class="sr-only">Kurulum formu 3/4: günlerin ve insanların.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Beyin bilgileri: günlerin ve insanların (3/4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Hangi günler çalışıyorsun?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Pzt</button>
        <button type="button" class="elicit-pill" data-value="Tue">Sal</button>
        <button type="button" class="elicit-pill" data-value="Wed">Çar</button>
        <button type="button" class="elicit-pill" data-value="Thu">Per</button>
        <button type="button" class="elicit-pill" data-value="Fri">Cum</button>
        <button type="button" class="elicit-pill" data-value="Sat">Cmt</button>
        <button type="button" class="elicit-pill" data-value="Sun">Paz</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Sabah özetin saat kaçta hazır olsun?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Özet istemiyorum</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Diğer</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Şu an işinde en önemli kişiler kimler? En fazla 3 isim, her biri bir satırda.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, yayınevindeki editörüm&#10;João, atölye ortağım&#10;Lia, menajerim"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Kimlerle çalışıyorsun?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Müşteriler</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Ortaklar</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Ekip ya da serbest çalışanlar</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Kurumlar, basın ya da mekânlar</button>
        <button type="button" class="elicit-pill" data-value="Just me">Sadece ben</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Diğer</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Öğrenciler" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">İş ya da kişisel projeler için kullandığın sosyal medya hesaplarını yaz.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (iş)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (kişisel)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">İnsanlarla nerede konuşuyorsun?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail ya da Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook ya da Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack ya da Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Diğer</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Notların ve işlerin bugün nerede duruyor?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive ya da Dokümanlar</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notlar</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva ya da Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Tablolar</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Kâğıt defterler</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Diğer</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Yazılarında nasıl bir tonun olsun?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Sıcak ve kişisel</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Açık sözlü ve kendinden emin</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Alçakgönüllü ve dürüst</button>
        <button type="button" class="elicit-pill" data-value="Playful">Eğlenceli</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Diğer</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Bir arkadaşımla konuşur gibi" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Atla</button>
    <button type="button" class="elicit-submit">Devam</button>
  </div>
</form>
