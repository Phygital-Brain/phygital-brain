  <div class="elicit-body">
    <!-- JOB QUESTIONS: replace this whole block, down to END JOB QUESTIONS, with 3 questions written for the person's own work (see SKILL.md, Form 2). Example for an illustrator:
    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Per project">Per project</button>
        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>
    END JOB QUESTIONS -->
    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Quem são seus clientes?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">Empresas e marcas</button>
        <button type="button" class="elicit-pill" data-value="Agencies">Agências</button>
        <button type="button" class="elicit-pill" data-value="Individuals">Pessoas físicas</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Outros criadores</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Outro</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Escolas" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Como a maioria dos clientes chega até você?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">Indicação e boca a boca</button>
        <button type="button" class="elicit-pill" data-value="Social media">Redes sociais</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">Eu vou atrás deles</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">Plataformas ou marketplaces</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Outro</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Feiras de livros" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">O que mais te atrasa?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Encontrar clientes</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Burocracia, orçamentos e notas fiscais</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Postar conteúdo com frequência</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Ferramentas demais e anotações espalhadas</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Ou diga do seu jeito"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é sua principal meta para os próximos 12 meses?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Ganhar mais</button>
        <button type="button" class="elicit-pill" data-value="More free time">Ter mais tempo livre</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Lançar algo novo</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Me organizar</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Ou diga do seu jeito: fechar contrato do meu primeiro livro"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Quais áreas mais importam agora?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Carreira ou trabalho</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Aprendizado ou estudos</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Projetos criativos</button>
        <button type="button" class="elicit-pill" data-value="Side project">Projeto paralelo</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Outro</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Saúde e esporte" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">O que mais te atrasa?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Muitas ideias, pouca execução</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Anotações espalhadas</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Esquecer detalhes sobre as pessoas</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">Falta de metas claras</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Ou diga do seu jeito"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Qual é sua principal meta para os próximos 12 meses?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Crescer na carreira</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Terminar um projeto grande</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Aprender uma habilidade nova</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Me organizar</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Ou diga do seu jeito: terminar meu primeiro curta"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">No que você está trabalhando agora? Até 3, um por linha.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Novo livro ilustrado para uma editora&#10;Site de portfólio&#10;Juntar dinheiro para um ateliê"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">O que mais te preocupa agora?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Dois prazos na mesma semana e nenhum tempo para buscar trabalho novo"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Pular</button>
    <button type="button" class="elicit-submit">Continuar</button>
  </div>
</form>
