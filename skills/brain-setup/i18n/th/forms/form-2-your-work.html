    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">ลูกค้าของคุณคือใคร?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">ธุรกิจและแบรนด์</button>
        <button type="button" class="elicit-pill" data-value="Agencies">เอเจนซี</button>
        <button type="button" class="elicit-pill" data-value="Individuals">บุคคลทั่วไป</button>
        <button type="button" class="elicit-pill" data-value="Other creators">ครีเอเตอร์คนอื่นๆ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="โรงเรียน" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ลูกค้าส่วนใหญ่รู้จักคุณจากทางไหน?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">คนแนะนำและบอกต่อกัน</button>
        <button type="button" class="elicit-pill" data-value="Social media">โซเชียลมีเดีย</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">ฉันติดต่อไปหาเอง</button>

        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="งานสัปดาห์หนังสือ" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">อะไรทำให้งานของคุณช้าที่สุด?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">การหาลูกค้า</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">งานเอกสาร ใบเสนอราคา และใบแจ้งหนี้</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">การโพสต์คอนเทนต์ให้สม่ำเสมอ</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">เครื่องมือเยอะเกินไป และโน้ตกระจัดกระจาย</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="หรือบอกด้วยคำของคุณเอง"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">เป้าหมายหลักของคุณใน 12 เดือนข้างหน้าคืออะไร?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">หารายได้เพิ่ม</button>
        <button type="button" class="elicit-pill" data-value="More free time">มีเวลาว่างมากขึ้น</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">เปิดตัวอะไรใหม่ๆ</button>
        <button type="button" class="elicit-pill" data-value="Get organised">จัดชีวิตให้เป็นระเบียบ</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="หรือบอกด้วยคำของคุณเอง: เซ็นสัญญาหนังสือเล่มแรก"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">

        <button type="button" class="elicit-pill" data-value="Career or job">อาชีพหรืองานประจำ</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">การเรียนหรือหาความรู้ใหม่</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">งานสร้างสรรค์</button>
        <button type="button" class="elicit-pill" data-value="Side project">โปรเจกต์เสริม</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="สุขภาพและกีฬา" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">อะไรทำให้งานของคุณช้าที่สุด?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">ไอเดียเยอะ แต่ไม่ได้ทำต่อให้จบ</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">โน้ตกระจัดกระจาย</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">ลืมรายละเอียดเรื่องของคน</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">ไม่มีเป้าหมายชัดเจน</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="หรือบอกด้วยคำของคุณเอง"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">เป้าหมายหลักของคุณใน 12 เดือนข้างหน้าคืออะไร?</label>

        <button type="button" class="elicit-pill" data-value="Learn a new skill">เรียนทักษะใหม่</button>

      <textarea class="elicit-textarea" data-name="goal_text" placeholder="หรือบอกด้วยคำของคุณเอง: ทำหนังสั้นเรื่องแรกให้เสร็จ"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">

    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">ข้าม</button>
