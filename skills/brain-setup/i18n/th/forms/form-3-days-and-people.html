<h2 class="sr-only">ฟอร์มตั้งค่า 3 จาก 4: วันทำงานและคนรอบตัวคุณ</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>ข้อมูลสมอง: วันทำงานและคนรอบตัวคุณ (3 จาก 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">คุณทำงานวันไหนบ้าง?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">จ.</button>
        <button type="button" class="elicit-pill" data-value="Tue">อ.</button>
        <button type="button" class="elicit-pill" data-value="Wed">พ.</button>
        <button type="button" class="elicit-pill" data-value="Thu">พฤ.</button>
        <button type="button" class="elicit-pill" data-value="Fri">ศ.</button>
        <button type="button" class="elicit-pill" data-value="Sat">ส.</button>
        <button type="button" class="elicit-pill" data-value="Sun">อา.</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">อยากให้สรุปยามเช้าพร้อมกี่โมง?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">ไม่ต้องมีสรุป</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">ตอนนี้ใครสำคัญที่สุดในงานของคุณ? ไม่เกิน 3 ชื่อ บรรทัดละคน</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="คุณมาลี บรรณาธิการที่สำนักพิมพ์&#10;ต้น หุ้นส่วนสตูดิโอ&#10;คุณลี ผู้จัดการส่วนตัว"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณทำงานกับใครบ้าง?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">ลูกค้า</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">ผู้ร่วมงาน</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">ทีมหรือฟรีแลนซ์</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">พาร์ตเนอร์ สื่อ หรือสถานที่จัดงาน</button>
        <button type="button" class="elicit-pill" data-value="Just me">ทำคนเดียว</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="นักเรียนนักศึกษา" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ใส่โซเชียลมีเดียของคุณ ทั้งของงานและโปรเจกต์ส่วนตัว</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/mali.draws (งาน)&#10;linkedin.com/in/malijaidee&#10;tiktok.com/@malisketchbook (ส่วนตัว)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณคุยกับคนอื่นผ่านช่องทางไหน?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail หรือ Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook หรือ Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack หรือ Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ตอนนี้โน้ตและงานของคุณอยู่ที่ไหน?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive หรือ Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva หรือ Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">สเปรดชีต</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">สมุดจด</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">อยากให้งานเขียนของคุณฟังดูเป็นแบบไหน?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">อบอุ่นและเป็นกันเอง</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">ตรงไปตรงมาและมั่นใจ</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">ถ่อมตัวและจริงใจ</button>
        <button type="button" class="elicit-pill" data-value="Playful">สนุกขี้เล่น</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="เหมือนคุยกับเพื่อน" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">ข้าม</button>
    <button type="button" class="elicit-submit">ต่อไป</button>
  </div>
</form>
