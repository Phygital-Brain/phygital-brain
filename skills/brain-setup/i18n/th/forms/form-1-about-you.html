<h2 class="sr-only">ฟอร์มตั้งค่า 1 จาก 4: เกี่ยวกับคุณ</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>ข้อมูลสมอง: เกี่ยวกับคุณ (1 จาก 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">คุณชื่ออะไร และทำอะไรอยู่ บอกสั้นๆ ในบรรทัดเดียว</label>
      <input type="text" data-name="name" placeholder="มะลิ ใจดี นักวาดภาพประกอบหนังสือเด็ก">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ข้อไหนตรงกับคุณที่สุด?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ฟรีแลนซ์หรือครีเอเตอร์</span><br><span style="font-size:11px; color:var(--text-muted)">เป็นนายตัวเอง</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">เจ้าของธุรกิจเล็กๆ</span><br><span style="font-size:11px; color:var(--text-muted)">บริษัทคนเดียวหรือบริษัทเล็กมาก</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">พนักงานหรือมืออาชีพ</span><br><span style="font-size:11px; color:var(--text-muted)">ทำงานให้บริษัท</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">โปรเจกต์ส่วนตัว</span><br><span style="font-size:11px; color:var(--text-muted)">เรียน งานอดิเรก โปรเจกต์เสริม</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">อื่นๆ</span><br><span style="font-size:11px; color:var(--text-muted)">เขียนด้วยคำของคุณเอง</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="ครูที่ขายคอร์สออนไลน์เป็นงานเสริม" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณขายอะไรหรือมีลูกค้าไหม?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">มี บริการหรือลูกค้า</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">มี สินค้า</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">ยังไม่มี แต่วางแผนไว้</button>
        <button type="button" class="elicit-pill" data-value="No">ไม่มี</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">อยากให้สมองที่สองช่วยเรื่องอะไร?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">จัดการโปรเจกต์</span><br><span style="font-size:11px; color:var(--text-muted)">แผน ความคืบหน้า ขั้นต่อไป</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">จำเรื่องของคนที่รู้จัก</span><br><span style="font-size:11px; color:var(--text-muted)">ลูกค้า ผู้ร่วมงาน คนที่ติดต่อด้วย</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ช่วยเขียนให้</span><br><span style="font-size:11px; color:var(--text-muted)">อีเมลและโพสต์ในสไตล์ของฉัน</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">เป้าหมายและการตัดสินใจ</span><br><span style="font-size:11px; color:var(--text-muted)">ฉันอยากไปให้ถึงตรงไหน และเพราะอะไร</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">อื่นๆ</span><br><span style="font-size:11px; color:var(--text-muted)">เขียนด้วยคำของคุณเอง</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="จดเรื่องหนังสือที่อ่าน" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณเก่งเรื่องอะไร? ทักษะ จุดแข็ง เรื่องที่คนชอบมาหาคุณ</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="วาดรูปสัตว์ อธิบายเรื่องยากให้เข้าใจง่าย ทำงานเร็วเมื่อเดดไลน์กระชั้น"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณยึดถืออะไร และงานแบบไหนที่คุณไม่รับ?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="ทำงานซื่อตรง ได้ค่าตอบแทนที่แฟร์ ไม่รับงานจากธุรกิจการพนันหรือบุหรี่"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณเข้าใจเรื่องต่างๆ ได้ดีที่สุดแบบไหน?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">ลิสต์สั้นๆ</button>
        <button type="button" class="elicit-pill" data-value="Examples">ตัวอย่าง</button>
        <button type="button" class="elicit-pill" data-value="Step by step">ทีละขั้น</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">รูปภาพและแผนภาพ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="ข้อความเสียงไว้ฟัง" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณมีสมาธิดีที่สุดช่วงไหน?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">เช้าตรู่</button>
        <button type="button" class="elicit-pill" data-value="Late morning">สายๆ</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">บ่าย</button>
        <button type="button" class="elicit-pill" data-value="Night">กลางคืน</button>
        <button type="button" class="elicit-pill" data-value="It changes">ไม่แน่นอน</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="อะไรทำให้คุณหมดพลัง? คุยโทรศัพท์นานๆ ข้อความเยอะเกินไป งานเอกสารวันศุกร์"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">อยากให้เอเจนต์ของคุณคุยกับคุณแบบไหน?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">สั้นและเข้าใจง่าย</button>
        <button type="button" class="elicit-pill" data-value="Detailed">ละเอียด</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">เป็นกันเองสบายๆ</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">ทางการและมืออาชีพ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>อื่นๆ</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="ตรงไปตรงมา มีอารมณ์ขันนิดหน่อย" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">คุณอยู่ที่ไหน? ไม่บังคับ ใช้ตั้งเขตเวลาของคุณ</label>
      <input type="text" data-name="city" placeholder="กรุงเทพฯ ประเทศไทย">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">มีลิงก์ที่บอกเรื่องของคุณไหม? เอเจนต์ของคุณจะอ่านให้ คุณจะได้พิมพ์น้อยลง</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">ข้าม</button>
    <button type="button" class="elicit-submit">ต่อไป</button>
  </div>
</form>
