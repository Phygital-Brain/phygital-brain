<h2 class="sr-only">Opsætning, formular 2 af 4: dit arbejde.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Din hjerne: dit arbejde (2 af 4)</span>
  </div>
  <div class="elicit-body">
    <!-- JOB QUESTIONS: replace this whole block, down to END JOB QUESTIONS, with 3 questions written for the person's own work (see SKILL.md, Form 2). Example for an illustrator:
    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Per project">Per project</button>
        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>
    END JOB QUESTIONS -->
    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Hvem er dine kunder?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">Virksomheder og brands</button>
        <button type="button" class="elicit-pill" data-value="Agencies">Bureauer</button>
        <button type="button" class="elicit-pill" data-value="Individuals">Privatpersoner</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Andre kreative</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Skoler" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvordan finder de fleste kunder dig?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">Anbefalinger og mund-til-mund</button>
        <button type="button" class="elicit-pill" data-value="Social media">Sociale medier</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">Jeg kontakter dem selv</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">Platforme eller markedspladser</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Bogmesser" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad bremser dig mest?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">At finde kunder</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Papirarbejde, tilbud og fakturaer</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">At poste indhold regelmæssigt</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">For mange værktøjer og spredte noter</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Eller sig det med dine egne ord"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad er dit vigtigste mål for de næste 12 måneder?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Tjene mere</button>
        <button type="button" class="elicit-pill" data-value="More free time">Mere fritid</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Lancere noget nyt</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Få styr på tingene</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Eller sig det med dine egne ord: skrive kontrakt på min første bog"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Hvilke områder betyder mest lige nu?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Karriere eller job</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Læring eller studier</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Kreative projekter</button>
        <button type="button" class="elicit-pill" data-value="Side project">Sideprojekt</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Sundhed og sport" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad bremser dig mest?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">For mange idéer, der aldrig bliver til noget</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Spredte noter</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Jeg glemmer detaljer om folk</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">Ingen klare mål</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="Eller sig det med dine egne ord"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad er dit vigtigste mål for de næste 12 måneder?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Komme videre i min karriere</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Gøre et stort projekt færdigt</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Lære noget nyt</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Få styr på tingene</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="Eller sig det med dine egne ord: gøre min første kortfilm færdig"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">Hvad arbejder du på lige nu? Op til 3, én pr. linje.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Ny billedbog til et forlag&#10;Portfolio-hjemmeside&#10;Spare op til et atelier"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad bekymrer dig mest lige nu?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="To deadlines i samme uge og ingen tid til at finde nye opgaver"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Spring over</button>
    <button type="button" class="elicit-submit">Fortsæt</button>
  </div>
</form>
