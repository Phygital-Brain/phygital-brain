<h2 class="sr-only">Opsætning, formular 1 af 4: om dig.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Din hjerne: om dig (1 af 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Hvad hedder du, og hvad laver du? Sig det på én linje.</label>
      <input type="text" data-name="name" placeholder="Ana Costa, illustrator af børnebøger">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad passer bedst på dig?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Freelancer eller kreativ</span><br><span style="font-size:11px; color:var(--text-muted)">Selvstændig</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Ejer af en lille virksomhed</span><br><span style="font-size:11px; color:var(--text-muted)">Enkeltmandsfirma eller mini-firma</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Ansat eller fagperson</span><br><span style="font-size:11px; color:var(--text-muted)">Arbejder i en virksomhed</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Personlige projekter</span><br><span style="font-size:11px; color:var(--text-muted)">Studier, hobbyer, sideprojekter</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Andet</span><br><span style="font-size:11px; color:var(--text-muted)">Skriv det med dine egne ord</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Lærer, der sælger kurser ved siden af" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Sælger du noget, eller har du kunder?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Ja, ydelser eller kunder</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Ja, produkter</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Ikke endnu, men det er planen</button>
        <button type="button" class="elicit-pill" data-value="No">Nej</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad skal din anden hjerne hjælpe dig med?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Holde styr på projekter</span><br><span style="font-size:11px; color:var(--text-muted)">Planer, status, næste skridt</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Huske personer</span><br><span style="font-size:11px; color:var(--text-muted)">Kunder, samarbejdspartnere, kontakter</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Skrive for mig</span><br><span style="font-size:11px; color:var(--text-muted)">Mails og opslag, der lyder som mig</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Mål og beslutninger</span><br><span style="font-size:11px; color:var(--text-muted)">Hvad jeg går efter, og hvorfor</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Andet</span><br><span style="font-size:11px; color:var(--text-muted)">Skriv det med dine egne ord</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="Holde styr på, hvad jeg læser" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad er du god til? Evner, styrker, det folk kommer til dig for.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Tegne dyr, forklare idéer enkelt, arbejde hurtigt under deadlines"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvad står du for, og hvilke opgaver siger du nej til?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Ærligt arbejde, fair betaling. Ingen kunder inden for spil eller tobak."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvordan forstår du ting bedst?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Korte lister</button>
        <button type="button" class="elicit-pill" data-value="Examples">Eksempler</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Trin for trin</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Billeder og diagrammer</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Lydbeskeder, jeg kan lytte til" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvornår er du bedst til at koncentrere dig?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Tidligt om morgenen</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Sidst på formiddagen</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Om eftermiddagen</button>
        <button type="button" class="elicit-pill" data-value="Night">Sent om aftenen</button>
        <button type="button" class="elicit-pill" data-value="It changes">Det skifter</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Hvad dræner dig? Lange opkald, for mange beskeder, papirarbejde om fredagen"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvordan skal din agent tale til dig?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Kort og enkelt</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Grundigt</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Venligt og afslappet</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Formelt og professionelt</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Direkte, med lidt humor" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvor bor du? Valgfrit. Det bruges til at sætte din tidszone.</label>
      <input type="text" data-name="city" placeholder="København, Danmark">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Har du et link, der beskriver dig? Din agent læser det, så du skal skrive mindre.</label>
      <input type="text" data-name="link" placeholder="https://ditwebsted.dk">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Spring over</button>
    <button type="button" class="elicit-submit">Fortsæt</button>
  </div>
</form>
