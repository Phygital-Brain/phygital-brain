<h2 class="sr-only">Opsætning, formular 3 af 4: dine dage og dine folk.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Din hjerne: dine dage og dine folk (3 af 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Hvilke dage arbejder du?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Man</button>
        <button type="button" class="elicit-pill" data-value="Tue">Tir</button>
        <button type="button" class="elicit-pill" data-value="Wed">Ons</button>
        <button type="button" class="elicit-pill" data-value="Thu">Tor</button>
        <button type="button" class="elicit-pill" data-value="Fri">Fre</button>
        <button type="button" class="elicit-pill" data-value="Sat">Lør</button>
        <button type="button" class="elicit-pill" data-value="Sun">Søn</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Hvornår skal dit morgenoverblik være klar?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Intet overblik</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Hvem betyder mest i dit arbejde lige nu? Op til 3 navne, én linje hver.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, min redaktør på forlaget&#10;João, min partner i atelieret&#10;Lia, min agent"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvem arbejder du sammen med?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Kunder</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Samarbejdspartnere</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Team eller freelancere</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partnere, presse eller spillesteder</button>
        <button type="button" class="elicit-pill" data-value="Just me">Kun mig</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Studerende" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Skriv dine profiler på sociale medier, både til arbejde og personlige projekter.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (arbejde)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (privat)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvor taler du med folk?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail eller Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook eller Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack eller Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvor ligger dine noter og dit arbejde i dag?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drev eller Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Noter</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva eller Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Regneark</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Notesbøger på papir</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Hvordan vil du lyde, når du skriver?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Varm og personlig</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Direkte og sikker</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Ydmyg og ærlig</button>
        <button type="button" class="elicit-pill" data-value="Playful">Legende</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Andet</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Som når jeg taler med en ven" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Spring over</button>
    <button type="button" class="elicit-submit">Fortsæt</button>
  </div>
</form>
