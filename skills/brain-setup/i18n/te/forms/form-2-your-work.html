    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">మీ కస్టమర్లు ఎవరు?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">వ్యాపారాలు, బ్రాండ్లు</button>
        <button type="button" class="elicit-pill" data-value="Agencies">ఏజెన్సీలు</button>
        <button type="button" class="elicit-pill" data-value="Individuals">వ్యక్తులు</button>
        <button type="button" class="elicit-pill" data-value="Other creators">ఇతర క్రియేటర్లు</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>ఇంకేదైనా</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="స్కూళ్ళు" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">ఎక్కువ మంది కస్టమర్లు మిమ్మల్ని ఎలా కనుక్కుంటారు?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">తెలిసినవాళ్ళ ద్వారా, నోటి మాటతో</button>
        <button type="button" class="elicit-pill" data-value="Social media">సోషల్ మీడియా</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">నేనే వాళ్ళను సంప్రదిస్తాను</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">ప్లాట్‌ఫామ్‌లు లేదా మార్కెట్‌ప్లేస్‌లు</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>ఇంకేదైనా</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="బుక్ ఫెయిర్లు" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">మిమ్మల్ని ఎక్కువగా వెనక్కి లాగేది ఏది?</label>

        <button type="button" class="elicit-pill" data-value="Finding clients">క్లయింట్లను వెతకడం</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">ఆఫీసు పనులు, కొటేషన్లు, ఇన్వాయిస్‌లు</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">క్రమం తప్పకుండా కంటెంట్ పోస్ట్ చేయడం</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">చాలా టూల్స్, అక్కడక్కడా చెల్లాచెదురుగా నోట్స్</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="లేదా మీ మాటల్లో చెప్పండి"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">రాబోయే 12 నెలల్లో మీ ముఖ్య లక్ష్యం ఏంటి?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">ఎక్కువ సంపాదించడం</button>
        <button type="button" class="elicit-pill" data-value="More free time">ఎక్కువ ఖాళీ సమయం</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">కొత్తది ఏదైనా మొదలుపెట్టడం</button>
        <button type="button" class="elicit-pill" data-value="Get organised">అన్నీ పద్ధతిగా సర్దుకోవడం</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="లేదా మీ మాటల్లో చెప్పండి: నా మొదటి పుస్తకం డీల్ సైన్ చేయడం"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">

      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">కెరీర్ లేదా ఉద్యోగం</button>

        <button type="button" class="elicit-pill" data-value="Side project">సైడ్ ప్రాజెక్ట్</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>ఇంకేదైనా</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="ఆరోగ్యం, ఆటలు" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">మిమ్మల్ని ఎక్కువగా వెనక్కి లాగేది ఏది?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">ఐడియాలు చాలా, పూర్తి చేసేవి తక్కువ</button>

        <button type="button" class="elicit-pill" data-value="Forgetting details about people">మనుషుల గురించి విషయాలు మర్చిపోవడం</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">స్పష్టమైన లక్ష్యాలు లేవు</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="లేదా మీ మాటల్లో చెప్పండి"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">రాబోయే 12 నెలల్లో మీ ముఖ్య లక్ష్యం ఏంటి?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">కెరీర్‌లో ఎదగడం</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">ఒక పెద్ద ప్రాజెక్ట్ పూర్తి చేయడం</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">కొత్త నైపుణ్యం నేర్చుకోవడం</button>
        <button type="button" class="elicit-pill" data-value="Get organised">అన్నీ పద్ధతిగా సర్దుకోవడం</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="లేదా మీ మాటల్లో చెప్పండి: నా మొదటి షార్ట్ ఫిల్మ్ పూర్తి చేయడం"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">ప్రస్తుతం మీరు దేనిమీద పని చేస్తున్నారు? 3 వరకు, లైన్‌కి ఒకటి.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="ఒక పబ్లిషర్ కోసం కొత్త బొమ్మల పుస్తకం&#10;పోర్ట్‌ఫోలియో వెబ్‌సైట్&#10;స్టూడియో కోసం పొదుపు"></textarea>

    <div class="elicit-group">

      <textarea class="elicit-textarea" data-name="worries" placeholder="ఒకే వారంలో రెండు డెడ్‌లైన్లు, కొత్త పని వెతుక్కోవడానికి టైమే లేదు"></textarea>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">వదిలేయండి</button>
    <button type="button" class="elicit-submit">కొనసాగించండి</button>
  </div>
</form>
