<h2 class="sr-only">Formularul de configurare 3 din 4: zilele tale și oamenii tăi.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Creierul tău: zilele tale și oamenii tăi (3 din 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">În ce zile lucrezi?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Lun</button>
        <button type="button" class="elicit-pill" data-value="Tue">Mar</button>
        <button type="button" class="elicit-pill" data-value="Wed">Mie</button>
        <button type="button" class="elicit-pill" data-value="Thu">Joi</button>
        <button type="button" class="elicit-pill" data-value="Fri">Vin</button>
        <button type="button" class="elicit-pill" data-value="Sat">Sâm</button>
        <button type="button" class="elicit-pill" data-value="Sun">Dum</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">La ce oră să fie gata rezumatul de dimineață?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Fără rezumat</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altceva</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Cine contează cel mai mult în munca ta acum? Maximum 3 nume, câte unul pe rând.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, editoarea mea de la editură&#10;Radu, partener de atelier&#10;Lia, agenta mea"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Cu cine lucrezi?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Clienți</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Colaboratori</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Echipă sau freelanceri</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Parteneri, presă sau locații</button>
        <button type="button" class="elicit-pill" data-value="Just me">Doar eu</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altceva</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Elevi și studenți" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Scrie-ți conturile de pe rețelele sociale, pentru muncă sau proiecte personale.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (muncă)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (personal)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Unde vorbești cu oamenii?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail sau Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook sau Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack sau Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altceva</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Unde îți ții acum notițele și fișierele de lucru?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive sau Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva sau Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Tabele (Excel, Sheets)</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Caiete de hârtie</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altceva</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Cum vrei să sune ce scrii?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Cald și personal</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Direct și cu încredere</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Modest și sincer</button>
        <button type="button" class="elicit-pill" data-value="Playful">Jucăuș</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Altceva</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Ca și cum aș vorbi cu un prieten" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Sari peste</button>
    <button type="button" class="elicit-submit">Continuă</button>
  </div>
</form>
