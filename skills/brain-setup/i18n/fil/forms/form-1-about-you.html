        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Personal na project</span><br><span style="font-size:11px; color:var(--text-muted)">Pag-aaral, hobby, side project</span></span></button>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">May ibinebenta ka ba o may kliyente ka?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">

        <button type="button" class="elicit-pill" data-value="Yes, products">Oo, mga produkto</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Wala pa, pero balak ko</button>
        <button type="button" class="elicit-pill" data-value="No">Wala</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Saan ka gustong tulungan ng pangalawang utak mo?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Ayusin ang mga project</span><br><span style="font-size:11px; color:var(--text-muted)">Plano, status, susunod na hakbang</span></span></button>

        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Magsulat para sa akin</span><br><span style="font-size:11px; color:var(--text-muted)">Email at post sa sarili kong boses</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Mga layunin at desisyon</span><br><span style="font-size:11px; color:var(--text-muted)">Ano ang gusto kong maabot at bakit</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Iba pa</span><br><span style="font-size:11px; color:var(--text-muted)">Isulat sa sarili mong salita</span></span></button>

      <label class="elicit-question">Saan ka magaling? Skills, lakas mo, at kung ano ang hinihingi sa iyo ng mga tao.</label>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ano ang pinaninindigan mo, at anong trabaho ang tinatanggihan mo?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Tapat na trabaho, patas na bayad. Walang kliyenteng sugal o sigarilyo."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Paano mo pinakamadaling naiintindihan ang mga bagay?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Maiikling listahan</button>
        <button type="button" class="elicit-pill" data-value="Examples">Mga halimbawa</button>

        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Larawan at diagram</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iba pa</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Voice note na puwede kong pakinggan" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Kailan ka pinakamadaling makapag-focus?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Maagang umaga</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Bago magtanghali</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Hapon</button>
        <button type="button" class="elicit-pill" data-value="Night">Gabi</button>
        <button type="button" class="elicit-pill" data-value="It changes">Nag-iiba-iba</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Ano ang nakakapagod sa iyo? Mahahabang call, sobrang daming message, admin tuwing Biyernes"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Paano ka dapat kausapin ng agent mo?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Maikli at simple</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Detalyado</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Palakaibigan at relaxed</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Pormal at propesyonal</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iba pa</button>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">Saan ka nakatira? Opsyonal lang, para ma-set ang time zone mo.</label>

    <div class="elicit-group">
      <label class="elicit-question">May link ka ba na naglalarawan sa iyo? Babasahin ito ng agent mo para mas kaunti ang ita-type mo.</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">

  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Laktawan</button>
    <button type="button" class="elicit-submit">Tuloy</button>
