  <div class="elicit-header">

  </div>
  <div class="elicit-body">
    <!-- JOB QUESTIONS: replace this whole block, down to END JOB QUESTIONS, with 3 questions written for the person's own work (see SKILL.md, Form 2). Example for an illustrator:
    <div class="elicit-group">
      <label class="elicit-question">What kind of illustration do you do most?</label>
      <div class="elicit-pills" data-name="job_type" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Picture books">Picture books</button>
        <button type="button" class="elicit-pill" data-value="Book covers">Book covers</button>
        <button type="button" class="elicit-pill" data-value="Editorial">Editorial</button>
        <button type="button" class="elicit-pill" data-value="Brand and packaging">Brand and packaging</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_type" placeholder="Murals" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Which publishers or clients have you worked with?</label>
      <textarea class="elicit-textarea" data-name="job_clients" placeholder="Penguin Kids, a local bakery, two indie authors"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">How do you charge?</label>
      <div class="elicit-pills" data-name="job_pricing" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Per project">Per project</button>
        <button type="button" class="elicit-pill" data-value="Per illustration">Per illustration</button>
        <button type="button" class="elicit-pill" data-value="Advance and royalties">Advance and royalties</button>
        <button type="button" class="elicit-pill" data-value="Hourly">Hourly</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="job_pricing" placeholder="Licensing fee" hidden>
    </div>
    END JOB QUESTIONS -->
    <!-- BUSINESS ON: keep this block only if BUSINESS = on -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Sino ang mga customer mo?</label>
      <div class="elicit-pills" data-name="customers" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Businesses and brands">Negosyo at brand</button>
        <button type="button" class="elicit-pill" data-value="Agencies">Mga agency</button>
        <button type="button" class="elicit-pill" data-value="Individuals">Mga indibidwal</button>
        <button type="button" class="elicit-pill" data-value="Other creators">Ibang creator</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iba pa</button>
      </div>
      <input type="text" class="elicit-other" data-for="customers" placeholder="Mga paaralan" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Paano ka kadalasang nahahanap ng mga customer?</label>
      <div class="elicit-pills" data-name="leads" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Referrals and word of mouth">Referral at rekomendasyon ng kakilala</button>
        <button type="button" class="elicit-pill" data-value="Social media">Social media</button>
        <button type="button" class="elicit-pill" data-value="I reach out to them">Ako ang lumalapit sa kanila</button>
        <button type="button" class="elicit-pill" data-value="Platforms or marketplaces">Platform o marketplace</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iba pa</button>
      </div>
      <input type="text" class="elicit-other" data-for="leads" placeholder="Mga book fair" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ano ang pinakanagpapabagal sa iyo?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Finding clients">Paghahanap ng kliyente</button>
        <button type="button" class="elicit-pill" data-value="Admin, quotes and invoices">Admin, quotation at invoice</button>
        <button type="button" class="elicit-pill" data-value="Posting content regularly">Regular na pag-post ng content</button>
        <button type="button" class="elicit-pill" data-value="Too many tools and scattered notes">Sobrang daming tool at kalat-kalat na note</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="O sabihin sa sarili mong salita"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ano ang pangunahing layunin mo sa susunod na 12 buwan?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Earn more">Kumita nang mas malaki</button>
        <button type="button" class="elicit-pill" data-value="More free time">Mas maraming free time</button>
        <button type="button" class="elicit-pill" data-value="Launch something new">Maglunsad ng bago</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Maging organisado</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="O sabihin sa sarili mong salita: makapirma ng una kong book deal"></textarea>
    </div>
    <!-- END BUSINESS ON -->
    <!-- BUSINESS OFF: keep this block only if BUSINESS = off -->
    <div class="elicit-group" style="border-top:0.5px solid var(--border); padding-top:1rem">
      <label class="elicit-question">Aling mga bahagi ng buhay mo ang pinakamahalaga ngayon?</label>
      <div class="elicit-pills" data-name="areas" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Career or job">Karera o trabaho</button>
        <button type="button" class="elicit-pill" data-value="Learning or studies">Pag-aaral</button>
        <button type="button" class="elicit-pill" data-value="Creative projects">Mga creative project</button>
        <button type="button" class="elicit-pill" data-value="Side project">Side project</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Iba pa</button>
      </div>
      <input type="text" class="elicit-other" data-for="areas" placeholder="Kalusugan at sports" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ano ang pinakanagpapabagal sa iyo?</label>
      <div class="elicit-pills" data-name="pain" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Too many ideas, no follow-through">Sobrang daming idea, walang natatapos</button>
        <button type="button" class="elicit-pill" data-value="Scattered notes">Kalat-kalat na note</button>
        <button type="button" class="elicit-pill" data-value="Forgetting details about people">Nakakalimutan ang detalye tungkol sa mga tao</button>
        <button type="button" class="elicit-pill" data-value="No clear goals">Walang malinaw na layunin</button>
      </div>
      <textarea class="elicit-textarea" data-name="pain_text" placeholder="O sabihin sa sarili mong salita"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ano ang pangunahing layunin mo sa susunod na 12 buwan?</label>
      <div class="elicit-pills" data-name="goal" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Grow in my career">Umasenso sa karera</button>
        <button type="button" class="elicit-pill" data-value="Finish a big project">Tapusin ang isang malaking project</button>
        <button type="button" class="elicit-pill" data-value="Learn a new skill">Matuto ng bagong skill</button>
        <button type="button" class="elicit-pill" data-value="Get organised">Maging organisado</button>
      </div>
      <textarea class="elicit-textarea" data-name="goal_text" placeholder="O sabihin sa sarili mong salita: tapusin ang una kong short film"></textarea>
    </div>
    <!-- END BUSINESS OFF -->
    <div class="elicit-group">
      <label class="elicit-question">Ano ang ginagawa mo ngayon? Hanggang 3, isa bawat linya.</label>
      <textarea class="elicit-textarea" data-name="projects" placeholder="Bagong picture book para sa isang publisher&#10;Portfolio website&#10;Pag-iipon para sa studio"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Ano ang pinakaipinag-aalala mo ngayon?</label>
      <textarea class="elicit-textarea" data-name="worries" placeholder="Dalawang deadline sa iisang linggo at walang oras maghanap ng bagong trabaho"></textarea>
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Laktawan</button>
    <button type="button" class="elicit-submit">Tuloy</button>
  </div>
</form>
