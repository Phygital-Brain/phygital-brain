        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Egne prosjekter</span><br><span style="font-size:11px; color:var(--text-muted)">Studier, hobbyer, sideprosjekter</span></span></button>

      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Lærer som selger kurs ved siden av" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Selger du noe, eller har du kunder?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Ja, tjenester eller kunder</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Ja, produkter</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Ikke ennå, men det er planen</button>
        <button type="button" class="elicit-pill" data-value="No">Nei</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hva skal den andre hjernen din hjelpe deg med?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Holde orden på prosjekter</span><br><span style="font-size:11px; color:var(--text-muted)">Planer, status, neste steg</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Huske folk</span><br><span style="font-size:11px; color:var(--text-muted)">Kunder, samarbeidspartnere, kontakter</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Skrive for meg</span><br><span style="font-size:11px; color:var(--text-muted)">E-poster og innlegg med min stemme</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Mål og beslutninger</span><br><span style="font-size:11px; color:var(--text-muted)">Hva jeg sikter mot, og hvorfor</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Annet</span><br><span style="font-size:11px; color:var(--text-muted)">Skriv det med dine egne ord</span></span></button>

    <div class="elicit-group">
      <label class="elicit-question">Hva er du god på? Ferdigheter, styrker, det folk kommer til deg for.</label>

    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hva står du for, og hvilke jobber sier du nei til?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Ærlig arbeid og rettferdig betaling. Ingen kunder innen pengespill eller tobakk."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvordan tar du lettest inn ny informasjon?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Korte lister</button>
        <button type="button" class="elicit-pill" data-value="Examples">Eksempler</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Steg for steg</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Bilder og diagrammer</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annet</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Talemeldinger jeg kan høre på" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Når klarer du best å konsentrere deg?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Tidlig om morgenen</button>
        <button type="button" class="elicit-pill" data-value="Late morning">Utpå formiddagen</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">Ettermiddag</button>
        <button type="button" class="elicit-pill" data-value="Night">Kveld og natt</button>
        <button type="button" class="elicit-pill" data-value="It changes">Det varierer</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Hva tapper deg for energi? Lange samtaler, for mange meldinger, papirarbeid på fredager"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvordan skal agenten din snakke med deg?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Kort og enkelt</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Utfyllende</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Vennlig og avslappet</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Formell og profesjonell</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annet</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Rett frem, med litt humor" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hvor holder du til? Valgfritt, det brukes til å stille inn tidssonen din.</label>
      <input type="text" data-name="city" placeholder="Oslo, Norge">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Har du en lenke som beskriver deg? Agenten din leser den, så du slipper å skrive så mye.</label>
      <input type="text" data-name="link" placeholder="https://dittnettsted.no">
    </div>

  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Hopp over</button>
    <button type="button" class="elicit-submit">Fortsett</button>
  </div>
