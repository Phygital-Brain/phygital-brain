<h2 class="sr-only">செட்டப் படிவம் 4-இல் 1: உங்களைப் பற்றி.</h2>

  <div class="elicit-header">

    <span>பிரெயின் விவரங்கள்: உங்களைப் பற்றி (4-இல் 1)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">உங்கள் பெயர் என்ன, நீங்கள் என்ன செய்கிறீர்கள்? ஒரே வரியில் சொல்லுங்கள்.</label>
      <input type="text" data-name="name" placeholder="கவிதா ராமன், குழந்தைகள் புத்தகங்களுக்கு ஓவியம் வரைபவர்">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">உங்களுக்கு எது மிகவும் பொருந்தும்?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ஃப்ரீலான்சர் அல்லது கிரியேட்டர்</span><br><span style="font-size:11px; color:var(--text-muted)">தனக்காகத் தானே வேலை செய்பவர்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">சிறு தொழில் உரிமையாளர்</span><br><span style="font-size:11px; color:var(--text-muted)">ஒருவர் மட்டும் அல்லது மிகச் சிறிய நிறுவனம்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">ஊழியர் அல்லது தொழில்முறை நிபுணர்</span><br><span style="font-size:11px; color:var(--text-muted)">ஒரு நிறுவனத்தில் வேலை செய்பவர்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">சொந்தத் திட்டங்கள்</span><br><span style="font-size:11px; color:var(--text-muted)">படிப்பு, பொழுதுபோக்கு, பக்கத் திட்டங்கள்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">வேறு</span><br><span style="font-size:11px; color:var(--text-muted)">உங்கள் வார்த்தைகளில் எழுதுங்கள்</span></span></button>

      <input type="text" class="elicit-other" data-for="you" placeholder="ஆசிரியர், கூடவே கோர்ஸ்களும் விற்கிறேன்" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">நீங்கள் ஏதாவது விற்கிறீர்களா, அல்லது உங்களுக்கு கிளையன்ட்கள் இருக்கிறார்களா?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">ஆம், சேவைகள் அல்லது கிளையன்ட்கள்</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">ஆம், பொருட்கள்</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">இன்னும் இல்லை, திட்டமிடுகிறேன்</button>
        <button type="button" class="elicit-pill" data-value="No">இல்லை</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">உங்கள் செகண்ட் பிரெயின் எதில் உதவ வேண்டும்?</label>

        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">திட்டங்களை ஒழுங்குபடுத்துவது</span><br><span style="font-size:11px; color:var(--text-muted)">திட்டங்கள், நிலை, அடுத்த படிகள்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">நபர்களை நினைவில் வைப்பது</span><br><span style="font-size:11px; color:var(--text-muted)">கிளையன்ட்கள், சக படைப்பாளிகள், தொடர்புகள்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">எனக்காக எழுதுவது</span><br><span style="font-size:11px; color:var(--text-muted)">என் பாணியில் மின்னஞ்சல்களும் போஸ்ட்களும்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">இலக்குகளும் முடிவுகளும்</span><br><span style="font-size:11px; color:var(--text-muted)">நான் எதை நோக்கிப் போகிறேன், ஏன்</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">வேறு</span><br><span style="font-size:11px; color:var(--text-muted)">உங்கள் வார்த்தைகளில் எழுதுங்கள்</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="நான் படிப்பதைக் கணக்கு வைப்பது" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">நீங்கள் எதில் சிறந்தவர்? திறமைகள், பலங்கள், மக்கள் எதற்காக உங்களிடம் வருகிறார்கள்.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="விலங்குகளை வரைவது, விஷயங்களை எளிமையாக விளக்குவது, டெட்லைனுக்குள் வேகமாக வேலை முடிப்பது"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">நீங்கள் எதை மதிக்கிறீர்கள், எந்த வேலையை மறுத்துவிடுவீர்கள்?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="நேர்மையான வேலை, நியாயமான சம்பளம். சூதாட்டம், புகையிலை கிளையன்ட்கள் வேண்டாம்."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">எப்படிச் சொன்னால் உங்களுக்கு நன்றாகப் புரியும்?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">சின்ன பட்டியல்கள்</button>
        <button type="button" class="elicit-pill" data-value="Examples">உதாரணங்கள்</button>
        <button type="button" class="elicit-pill" data-value="Step by step">படிப்படியாக</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">படங்களும் வரைபடங்களும்</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>வேறு</button>

      <input type="text" class="elicit-other" data-for="learning" placeholder="கேட்கக்கூடிய வாய்ஸ் நோட்ஸ்" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">எப்போது உங்களால் நன்றாகக் கவனம் செலுத்த முடியும்?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">அதிகாலை</button>
        <button type="button" class="elicit-pill" data-value="Late morning">மதியத்துக்கு முன்</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">மதியம்</button>
        <button type="button" class="elicit-pill" data-value="Night">இரவு</button>
        <button type="button" class="elicit-pill" data-value="It changes">மாறிக்கொண்டே இருக்கும்</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="உங்களை எது சோர்வடையச் செய்கிறது? நீண்ட கால்கள், அதிக மெசேஜ்கள், வெள்ளிக்கிழமை பேப்பர் வேலைகள்"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">உங்கள் ஏஜென்ட் உங்களிடம் எப்படிப் பேச வேண்டும்?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">சுருக்கமாக, எளிமையாக</button>
        <button type="button" class="elicit-pill" data-value="Detailed">விரிவாக</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">நட்பாக, இயல்பாக</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">முறையாக, தொழில்முறையாக</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>வேறு</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="நேரடியாக, கொஞ்சம் நகைச்சுவையுடன்" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">நீங்கள் எங்கே இருக்கிறீர்கள்? விருப்பம் இருந்தால் சொல்லுங்கள், இதை வைத்து உங்கள் நேர மண்டலம் அமைக்கப்படும்.</label>
      <input type="text" data-name="city" placeholder="சென்னை, இந்தியா">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">உங்களைப் பற்றிய லிங்க் ஏதாவது இருக்கிறதா? உங்கள் ஏஜென்ட் அதைப் படிக்கும், நீங்கள் குறைவாக டைப் செய்தால் போதும்.</label>
      <input type="text" data-name="link" placeholder="https://yoursite.com">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">தவிர்க்கவும்</button>
    <button type="button" class="elicit-submit">தொடரவும்</button>
  </div>
</form>
