  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Vad heter du och vad gör du? Svara på en rad.</label>
      <input type="text" data-name="name" placeholder="Ana Costa, illustratör av barnböcker">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Vad stämmer bäst in på dig?</label>
      <div class="elicit-pills" data-name="you" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Freelancer or creator" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-brush" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Frilansare eller kreatör</span><br><span style="font-size:11px; color:var(--text-muted)">Jobbar på egen hand</span></span></button>
        <button type="button" class="elicit-pill" data-value="Small business owner" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-building-store" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Driver ett litet företag</span><br><span style="font-size:11px; color:var(--text-muted)">Enmansföretag eller mycket litet företag</span></span></button>
        <button type="button" class="elicit-pill" data-value="Employee or professional" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-briefcase" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Anställd eller yrkesverksam</span><br><span style="font-size:11px; color:var(--text-muted)">Jobbar på ett företag</span></span></button>
        <button type="button" class="elicit-pill" data-value="Personal projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-plant" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Egna projekt</span><br><span style="font-size:11px; color:var(--text-muted)">Studier, hobbyer, sidoprojekt</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Annat</span><br><span style="font-size:11px; color:var(--text-muted)">Skriv med dina egna ord</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="you" placeholder="Lärare som säljer kurser vid sidan av" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Säljer du något eller har du kunder?</label>
      <div class="elicit-pills" data-name="selling" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Yes, services or clients">Ja, tjänster eller kunder</button>
        <button type="button" class="elicit-pill" data-value="Yes, products">Ja, produkter</button>
        <button type="button" class="elicit-pill" data-value="Not yet, planning to">Inte än, men jag planerar det</button>
        <button type="button" class="elicit-pill" data-value="No">Nej</button>
      </div>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Vad ska din andra hjärna hjälpa dig med?</label>
      <div class="elicit-pills" data-name="help" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Organise projects" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-layout-kanban" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Hålla ordning på projekt</span><br><span style="font-size:11px; color:var(--text-muted)">Planer, läge, nästa steg</span></span></button>
        <button type="button" class="elicit-pill" data-value="Remember people" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-users" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Komma ihåg personer</span><br><span style="font-size:11px; color:var(--text-muted)">Kunder, samarbetspartner, kontakter</span></span></button>
        <button type="button" class="elicit-pill" data-value="Write for me" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Skriva åt mig</span><br><span style="font-size:11px; color:var(--text-muted)">Mejl och inlägg med min röst</span></span></button>
        <button type="button" class="elicit-pill" data-value="Goals and decisions" style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-target" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Mål och beslut</span><br><span style="font-size:11px; color:var(--text-muted)">Vad jag siktar på och varför</span></span></button>
        <button type="button" class="elicit-pill" data-value="Other" data-other style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:180px; box-shadow:0 1px 2px rgba(0,0,0,0.04)"><i class="ti ti-pencil" style="font-size:20px" aria-hidden="true"></i><span><span style="font-size:13px; font-weight:500">Annat</span><br><span style="font-size:11px; color:var(--text-muted)">Skriv med dina egna ord</span></span></button>
      </div>
      <input type="text" class="elicit-other" data-for="help" placeholder="Hålla koll på vad jag läser" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Vad är du bra på? Kunskaper, styrkor, vad folk vänder sig till dig för.</label>
      <textarea class="elicit-textarea" data-name="strengths" placeholder="Rita djur, förklara idéer enkelt, jobba snabbt när det är bråttom"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Vad står du för, och vilka jobb säger du nej till?</label>
      <textarea class="elicit-textarea" data-name="values" placeholder="Ärligt arbete, rättvis betalning. Inga kunder inom spel om pengar eller tobak."></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hur tar du bäst till dig saker?</label>
      <div class="elicit-pills" data-name="learning" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Short lists">Korta listor</button>
        <button type="button" class="elicit-pill" data-value="Examples">Exempel</button>
        <button type="button" class="elicit-pill" data-value="Step by step">Steg för steg</button>
        <button type="button" class="elicit-pill" data-value="Pictures and diagrams">Bilder och diagram</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="learning" placeholder="Röstmeddelanden som jag kan lyssna på" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">När har du lättast att fokusera?</label>
      <div class="elicit-pills" data-name="focus_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Early morning">Tidigt på morgonen</button>
        <button type="button" class="elicit-pill" data-value="Late morning">På förmiddagen</button>
        <button type="button" class="elicit-pill" data-value="Afternoon">På eftermiddagen</button>
        <button type="button" class="elicit-pill" data-value="Night">På natten</button>
        <button type="button" class="elicit-pill" data-value="It changes">Det varierar</button>
      </div>
      <textarea class="elicit-textarea" data-name="energy" placeholder="Vad tar energi från dig? Långa samtal, för många meddelanden, pappersarbete på fredagar"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Hur ska din agent prata med dig?</label>
      <div class="elicit-pills" data-name="style" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Short and plain">Kort och enkelt</button>
        <button type="button" class="elicit-pill" data-value="Detailed">Utförligt</button>
        <button type="button" class="elicit-pill" data-value="Friendly and casual">Vänligt och avslappnat</button>
        <button type="button" class="elicit-pill" data-value="Formal and professional">Formellt och professionellt</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="style" placeholder="Rakt på sak, med lite humor" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Var bor du? Frivilligt, det styr din tidszon.</label>
      <input type="text" data-name="city" placeholder="Stockholm, Sverige">
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Har du en länk som beskriver dig? Din agent läser den så att du slipper skriva lika mycket.</label>
      <input type="text" data-name="link" placeholder="https://dinsida.se">
    </div>
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Hoppa över</button>
    <button type="button" class="elicit-submit">Fortsätt</button>
  </div>
</form>
