<h2 class="sr-only">Formulär 3 av 4: dina dagar och personer.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Din hjärna: dina dagar och personer (3 av 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Vilka dagar jobbar du?</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Mån</button>
        <button type="button" class="elicit-pill" data-value="Tue">Tis</button>
        <button type="button" class="elicit-pill" data-value="Wed">Ons</button>
        <button type="button" class="elicit-pill" data-value="Thu">Tor</button>
        <button type="button" class="elicit-pill" data-value="Fri">Fre</button>
        <button type="button" class="elicit-pill" data-value="Sat">Lör</button>
        <button type="button" class="elicit-pill" data-value="Sun">Sön</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">När ska din morgonöversikt vara klar?</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Ingen översikt</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Vilka är viktigast i ditt jobb just nu? Upp till 3 namn, en rad var.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Marta, min redaktör på förlaget&#10;João, delar ateljé med mig&#10;Lia, min agent"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Vilka jobbar du med?</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Kunder</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Samarbetspartner</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Team eller frilansare</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Partner, press eller scener</button>
        <button type="button" class="elicit-pill" data-value="Just me">Bara jag</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Studenter" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Skriv upp dina sociala medier, för jobbet eller egna projekt.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/ana.draws (jobb)&#10;linkedin.com/in/anacosta&#10;tiktok.com/@anasketchbook (privat)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Var pratar du med folk?</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail eller Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook eller Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack eller Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Var har du dina anteckningar och ditt jobb i dag?</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive eller Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Anteckningar</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva eller Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Kalkylark</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Anteckningsböcker på papper</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Hur vill du låta när du skriver?</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Varm och personlig</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Rak och säker</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Ödmjuk och ärlig</button>
        <button type="button" class="elicit-pill" data-value="Playful">Lekfull</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Annat</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Som när jag pratar med en vän" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Hoppa över</button>
    <button type="button" class="elicit-submit">Fortsätt</button>
  </div>
</form>
