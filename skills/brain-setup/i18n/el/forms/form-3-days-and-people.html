<h2 class="sr-only">Φόρμα ρύθμισης 3 από 4: οι μέρες σου και οι άνθρωποί σου.</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Στοιχεία εγκεφάλου: οι μέρες σου και οι άνθρωποί σου (3 από 4)</span>
  </div>
  <div class="elicit-body">
    <div class="elicit-group">
      <label class="elicit-question">Ποιες μέρες δουλεύεις;</label>
      <div class="elicit-pills" data-name="work_days" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Mon">Δευ</button>
        <button type="button" class="elicit-pill" data-value="Tue">Τρι</button>
        <button type="button" class="elicit-pill" data-value="Wed">Τετ</button>
        <button type="button" class="elicit-pill" data-value="Thu">Πεμ</button>
        <button type="button" class="elicit-pill" data-value="Fri">Παρ</button>
        <button type="button" class="elicit-pill" data-value="Sat">Σαβ</button>
        <button type="button" class="elicit-pill" data-value="Sun">Κυρ</button>
      </div>
    </div>
    <!-- BRIEF: keep this block only if BRIEF = on -->
    <div class="elicit-group">
      <label class="elicit-question">Πότε να είναι έτοιμη η πρωινή σου ενημέρωση;</label>
      <div class="elicit-pills" data-name="brief_time" data-multi="false">
        <button type="button" class="elicit-pill" data-value="7:00">7:00</button>
        <button type="button" class="elicit-pill" data-value="8:00">8:00</button>
        <button type="button" class="elicit-pill" data-value="9:00">9:00</button>
        <button type="button" class="elicit-pill" data-value="No brief">Χωρίς ενημέρωση</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Άλλο</button>
      </div>
      <input type="text" class="elicit-other" data-for="brief_time" placeholder="10:30" hidden>
    </div>
    <!-- END BRIEF -->
    <div class="elicit-group">
      <label class="elicit-question">Ποιοι άνθρωποι μετράνε πιο πολύ στη δουλειά σου τώρα; Μέχρι 3 ονόματα, ένα σε κάθε γραμμή.</label>
      <textarea class="elicit-textarea" data-name="key_people" placeholder="Μαρία, η επιμελήτριά μου στον εκδοτικό οίκο&#10;Γιάννης, συνεργάτης στο στούντιο&#10;Λία, η ατζέντισσά μου"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Με ποιους δουλεύεις;</label>
      <div class="elicit-pills" data-name="people" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Clients">Πελάτες</button>
        <button type="button" class="elicit-pill" data-value="Collaborators">Συνεργάτες</button>
        <button type="button" class="elicit-pill" data-value="Team or freelancers">Ομάδα ή freelancers</button>
        <button type="button" class="elicit-pill" data-value="Partners, press or venues">Εταίροι, Τύπος ή χώροι εκδηλώσεων</button>
        <button type="button" class="elicit-pill" data-value="Just me">Μόνο εγώ</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Άλλο</button>
      </div>
      <input type="text" class="elicit-other" data-for="people" placeholder="Μαθητές και φοιτητές" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Γράψε τα social media σου, για τη δουλειά ή για προσωπικά έργα.</label>
      <textarea class="elicit-textarea" data-name="social" placeholder="instagram.com/anna.draws (δουλειά)&#10;linkedin.com/in/annapappa&#10;tiktok.com/@annasketchbook (προσωπικό)"></textarea>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Πού μιλάς με τους άλλους;</label>
      <div class="elicit-pills" data-name="comms" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Gmail or Google Workspace">Gmail ή Google Workspace</button>
        <button type="button" class="elicit-pill" data-value="Outlook or Microsoft 365">Outlook ή Microsoft 365</button>
        <button type="button" class="elicit-pill" data-value="WhatsApp">WhatsApp</button>
        <button type="button" class="elicit-pill" data-value="Slack or Teams">Slack ή Teams</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Άλλο</button>
      </div>
      <input type="text" class="elicit-other" data-for="comms" placeholder="Telegram" hidden>
    </div>
    <div class="elicit-group">
      <label class="elicit-question">Πού βρίσκονται σήμερα οι σημειώσεις και η δουλειά σου;</label>
      <div class="elicit-pills" data-name="notes_now" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Google Drive or Docs">Google Drive ή Docs</button>
        <button type="button" class="elicit-pill" data-value="Notion">Notion</button>
        <button type="button" class="elicit-pill" data-value="Apple Notes">Apple Notes</button>
        <button type="button" class="elicit-pill" data-value="Canva or Figma">Canva ή Figma</button>
        <button type="button" class="elicit-pill" data-value="Spreadsheets">Υπολογιστικά φύλλα</button>
        <button type="button" class="elicit-pill" data-value="Paper notebooks">Χάρτινα τετράδια</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Άλλο</button>
      </div>
      <input type="text" class="elicit-other" data-for="notes_now" placeholder="Evernote" hidden>
    </div>
    <!-- VOICE: keep this block only if BUSINESS = on and WRITE = on -->
    <div class="elicit-group">
      <label class="elicit-question">Πώς θέλεις να ακούγεσαι όταν γράφεις;</label>
      <div class="elicit-pills" data-name="voice" data-multi="true">
        <button type="button" class="elicit-pill" data-value="Warm and personal">Ζεστά και προσωπικά</button>
        <button type="button" class="elicit-pill" data-value="Direct and confident">Ευθέως και με αυτοπεποίθηση</button>
        <button type="button" class="elicit-pill" data-value="Humble and honest">Σεμνά και ειλικρινά</button>
        <button type="button" class="elicit-pill" data-value="Playful">Παιχνιδιάρικα</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Άλλο</button>
      </div>
      <input type="text" class="elicit-other" data-for="voice" placeholder="Σαν να μιλάω με φίλο" hidden>
    </div>
    <!-- END VOICE -->
  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Παράλειψη</button>
    <button type="button" class="elicit-submit">Συνέχεια</button>
  </div>
</form>
