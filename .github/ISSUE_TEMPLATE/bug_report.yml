name: Something doesn't work
description: The setup, the Brain Keeper or a rule did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. **Never paste your real notes, real names, private details, or anything from `Memory/finances/`.** Use a small made-up example instead.
        If something could leak private notes or make the agent ignore the rules, don't open an issue: [report it privately](https://github.com/Phygital-Brain/phygital-brain/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version
      description: "The first line of your brain's root CLAUDE.md, or the plugin version"
      placeholder: "Phygital Brain, version 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - "Installing the plugin"
        - "The setup forms"
        - "Building the brain"
        - "Daily use: filing things"
        - "Brain Keeper: the daily tidy"
        - "Brain Keeper: the check-up"
        - "Morning brief"
        - "Upgrading an older brain"
        - "Docs"
        - "Something else"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Your agent and app
      placeholder: "Claude desktop app, Claude Code, Codex, ..."
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Your brain's language
      placeholder: "English, Português (Brasil), ..."
  - type: input
    id: os
    attributes:
      label: Computer
      placeholder: "macOS 26, Windows 11, ..."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you said or did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to say or click, in order, ideally in a test brain.
      placeholder: |
        1. Set up my second brain
        2. Picked "Personal projects" and "No brief"
        3. ...
