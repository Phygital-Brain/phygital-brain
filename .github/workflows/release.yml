# Releases Phygital Brain when a push to main raises the version in package.json.
# If there's no GitHub release for that version yet, it runs the checks, publishes
# to npm (npx -y phygital-brain), then creates the vX.Y.Z release with the Claude
# desktop extension (.mcpb) attached and the CHANGELOG entry as its notes.
# npm trusts this workflow through trusted publishing, so no token is stored anywhere.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the .mcpb
      id-token: write # npm trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5, pinned
        with:
          persist-credentials: false

      - name: Is this a new version?
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released. Nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5, pinned
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use the newest npm (trusted publishing needs 11.5.1 or newer)
        if: steps.version.outputs.new == 'true'
        run: npm install -g npm@12.2.0  # zizmor: ignore[adhoc-packages] npm itself, pinned

      - name: Run the checks
        if: steps.version.outputs.new == 'true'
        run: python3 scripts/check.py

      - name: Get the release notes from CHANGELOG.md
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v="$VERSION"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $v' entry."
            exit 1
          fi

      - name: Build the Claude desktop extension
        if: steps.version.outputs.new == 'true'
        run: python3 scripts/build_mcpb.py

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6   # v4.1.2, pinned
        if: steps.version.outputs.new == 'true'

      # Signed before anything is published, so a signing problem stops the release with nothing half done.
      # Keyless (Sigstore): no secret is stored. Users check it with the command in SECURITY.md.
      - name: Sign the extension file
        if: steps.version.outputs.new == 'true'
        run: cosign sign-blob --yes --bundle dist/phygital-brain.mcpb.sigstore.json dist/phygital-brain.mcpb

      - name: Publish to npm
        if: steps.version.outputs.new == 'true'
        run: npm publish --access public

      - name: Create the release with the Claude desktop extension
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v="$VERSION"
          gh release create "v$v" dist/phygital-brain.mcpb dist/phygital-brain.mcpb.sigstore.json --title "$v" --notes-file notes.md --target "$GITHUB_SHA"
